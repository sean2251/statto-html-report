<svg width="880" height="902" viewBox="0 0 880 902" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Statto team-report setup flow: take stats, import the file, run the script, customise, optionally split video tagging, publish the team report, share it.">
  <!-- ground -->
  <rect x="1" y="1" width="878" height="900" rx="18" fill="#F5F3EC" stroke="#E2E0D7" stroke-width="1.5"/>

  <!-- header -->
  <text x="44" y="52" font-size="12" font-weight="600" letter-spacing="2.1" fill="#1F5A38">STATTO · TEAM-REPORT SETUP</text>
  <text x="43" y="92" font-size="34" font-weight="800" letter-spacing="-0.6" fill="#1C271F">Field to Team Report</text>
  <text x="44" y="120" font-size="15" fill="#5A665C">From a season of stats to one interactive report your team opens in a browser.</text>

  <!-- legend -->
  <circle cx="52" cy="146" r="6" fill="#2E7D4E"/>
  <text x="64" y="151" font-size="13" fill="#5A665C"><tspan font-weight="700" fill="#1C271F">Core steps</tspan> — everyone does these</text>
  <rect x="303" y="141" width="10" height="10" rx="2" fill="#B67C15" transform="rotate(45 308 146)"/>
  <text x="323" y="151" font-size="13" fill="#5A665C"><tspan font-weight="700" fill="#1C271F">Optional side path</tspan> — only if tagging as a group</text>

  <!-- ============ main green spine ============ -->
  <line x1="78" y1="210" x2="78" y2="838" stroke="#2E7D4E" stroke-width="2" opacity="0.32"/>

  <!-- Step 1 -->
  <text x="116" y="204" font-size="18" font-weight="800" fill="#1C271F">Take stats during games</text>
  <text x="116" y="226" font-size="15" fill="#5A665C">Record every pass, block and point in the Statto app.</text>
  <circle cx="78" cy="210" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="217" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">1</text>

  <!-- Step 2 -->
  <text x="116" y="290" font-size="18" font-weight="800" fill="#1C271F">Get the file onto your computer</text>
  <text x="116" y="312" font-size="15" fill="#5A665C">Export your season and save the .statto file.</text>
  <circle cx="78" cy="296" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="303" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">2</text>

  <!-- Step 3 -->
  <text x="116" y="376" font-size="18" font-weight="800" fill="#1C271F">Run the script</text>
  <text x="116" y="398" font-size="15" fill="#5A665C">One command turns it into a full interactive HTML report.</text>
  <circle cx="78" cy="382" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="389" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">3</text>

  <!-- Step 4 -->
  <text x="116" y="462" font-size="18" font-weight="800" fill="#1C271F">Make it yours</text>
  <text x="116" y="484" font-size="15" fill="#5A665C">In the Set up tab: add YouTube links, lines, tournament names and photos.</text>
  <circle cx="78" cy="468" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="475" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">4</text>

  <!-- ============ optional side path ============ -->
  <rect x="104" y="512" width="732" height="222" rx="14" fill="#F6EEDC" stroke="#B67C15" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="128" y="542" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#8F5F0C">◆ OPTIONAL SIDE PATH — BRANCHES OFF AFTER STEP 4</text>
  <text x="128" y="568" font-size="17" font-weight="800" fill="#1C271F">Split the video tagging across people</text>

  <!-- gold sub-spine -->
  <line x1="146" y1="600" x2="146" y2="702" stroke="#B67C15" stroke-width="2" opacity="0.42"/>

  <!-- a -->
  <circle cx="146" cy="600" r="13" fill="#FCFBF6" stroke="#B67C15" stroke-width="2"/>
  <text x="146" y="605" font-size="13" font-weight="700" text-anchor="middle" fill="#8F5F0C" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">a</text>
  <text x="172" y="605" font-size="14.5" fill="#1C271F">Create a single-game tagging page for each game.</text>
  <!-- b -->
  <circle cx="146" cy="634" r="13" fill="#FCFBF6" stroke="#B67C15" stroke-width="2"/>
  <text x="146" y="639" font-size="13" font-weight="700" text-anchor="middle" fill="#8F5F0C" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">b</text>
  <text x="172" y="639" font-size="14.5" fill="#1C271F">Host or send them out — e.g. a free Netlify drop.</text>
  <!-- c -->
  <circle cx="146" cy="668" r="13" fill="#FCFBF6" stroke="#B67C15" stroke-width="2"/>
  <text x="146" y="673" font-size="13" font-weight="700" text-anchor="middle" fill="#8F5F0C" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">c</text>
  <text x="172" y="673" font-size="14.5" fill="#1C271F">Helpers tag their game, then export a small JSON file.</text>
  <!-- d -->
  <circle cx="146" cy="702" r="13" fill="#FCFBF6" stroke="#B67C15" stroke-width="2"/>
  <text x="146" y="707" font-size="13" font-weight="700" text-anchor="middle" fill="#8F5F0C" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">d</text>
  <text x="172" y="707" font-size="14.5" fill="#1C271F">Upload the files back to merge everyone's work in.</text>

  <!-- ============ resume main spine ============ -->
  <!-- Step 5 -->
  <text x="116" y="774" font-size="18" font-weight="800" fill="#1C271F">Publish the team report</text>
  <text x="116" y="796" font-size="15" fill="#5A665C">Publish for team (read-only) bakes it all into one standalone file.</text>
  <circle cx="78" cy="780" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="787" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">5</text>

  <!-- Step 6 -->
  <text x="116" y="838" font-size="18" font-weight="800" fill="#1C271F">Share it</text>
  <text x="116" y="860" font-size="15" fill="#5A665C">Host it (e.g. Netlify) or send it, and share the link.</text>
  <circle cx="78" cy="838" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="845" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">6</text>

  <!-- footer tip -->
  <text x="44" y="890" font-size="12.5" fill="#8B968B">⚠  Open it from a hosted link, not off disk (file://), so the videos, clips and photos load.</text>
</svg>
