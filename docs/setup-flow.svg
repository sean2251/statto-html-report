<svg width="880" height="1040" viewBox="0 0 880 1040" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Statto workflow: take stats in Statto and export the .statto file. In the Statto Reports app, create a season from it, and add each newer export as you stat more games, in any order. In the season's Set up editor, which saves to a folder on your computer, you set up tournaments and video links, tag the film, and set up your lines. Optionally, share a game with a helper: download its game file and send it with the shared tagging site's link; they tag in their browser and send back a JSON file that you upload. Then publish the read-only, mobile Team Report, with every analysis tab and shareable view links, which is what your team opens.">
  <!-- ground -->
  <rect x="1" y="1" width="878" height="1038" rx="18" fill="#F5F3EC" stroke="#E2E0D7" stroke-width="1.5"/>

  <!-- header -->
  <text x="44" y="50" font-size="12" font-weight="600" letter-spacing="2.1" fill="#1F5A38">STATTO REPORTS · SET UP EDITOR → TEAM REPORT</text>
  <text x="43" y="92" font-size="34" font-weight="800" letter-spacing="-0.6" fill="#1C271F">From field to Team Report</text>
  <text x="44" y="120" font-size="15" fill="#5A665C">Build your season in the app, tag the film (with helpers if you like), then publish the Team Report.</text>

  <!-- legend -->
  <circle cx="52" cy="150" r="6" fill="#2E7D4E"/>
  <text x="64" y="155" font-size="13" fill="#5A665C"><tspan font-weight="700" fill="#1C271F">Set up editor</tspan> — in the app, where you author</text>
  <rect x="392" y="145" width="10" height="10" rx="2" fill="#B67C15"/>
  <text x="410" y="155" font-size="13" fill="#5A665C"><tspan font-weight="700" fill="#1C271F">Helpers</tspan> — optional</text>
  <rect x="566" y="145" width="10" height="10" rx="2" fill="#2F6DB5"/>
  <text x="584" y="155" font-size="13" fill="#5A665C"><tspan font-weight="700" fill="#1C271F">Team Report</tspan> — what your team opens</text>

  <!-- ============ inputs (green spine) ============ -->
  <line x1="78" y1="205" x2="78" y2="349" stroke="#2E7D4E" stroke-width="2" opacity="0.30"/>

  <!-- Step 1 -->
  <text x="116" y="199" font-size="17" font-weight="800" fill="#1C271F">Take stats in Statto</text>
  <text x="116" y="221" font-size="14.5" fill="#5A665C">Record passes, blocks and points, live or from film.</text>
  <circle cx="78" cy="205" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="212" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">1</text>

  <!-- Step 2 -->
  <text x="116" y="271" font-size="17" font-weight="800" fill="#1C271F">Export the .statto file</text>
  <text x="116" y="293" font-size="14.5" fill="#5A665C">Export the whole team onto your computer.</text>
  <circle cx="78" cy="277" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="284" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">2</text>

  <!-- Step 3 -->
  <text x="116" y="343" font-size="17" font-weight="800" fill="#1C271F">Bring it into the Statto Reports app</text>
  <text x="116" y="365" font-size="14.5" fill="#5A665C">Create a season from it. Stat'd more games? <tspan font-weight="700" fill="#1C271F">Add newer Statto export</tspan> — in any order.</text>
  <circle cx="78" cy="349" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="356" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">3</text>

  <!-- loop back from 3 to 1: more games -->
  <path d="M60 340 C 28 320, 28 230, 58 212" fill="none" stroke="#2E7D4E" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M54 206 L64 210 L57 218 Z" fill="#2E7D4E" opacity="0.6"/>

  <!-- connector into editor panel -->
  <line x1="78" y1="370" x2="78" y2="404" stroke="#2E7D4E" stroke-width="2" opacity="0.30"/>

  <!-- ============ SET UP EDITOR panel ============ -->
  <rect x="44" y="404" width="792" height="368" rx="16" fill="#FCFBF6" stroke="#2E7D4E" stroke-width="1.5"/>
  <text x="68" y="434" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#1F5A38">SET UP EDITOR — SAVES AUTOMATICALLY TO THE SEASON'S FOLDER</text>
  <line x1="68" y1="448" x2="812" y2="448" stroke="#E2E0D7" stroke-width="1"/>

  <!-- Set up tab -->
  <rect x="68" y="465" width="66" height="26" rx="13" fill="#E6F0E9"/>
  <text x="101" y="482" font-size="13" font-weight="700" text-anchor="middle" fill="#1F5A38">Set up</text>
  <text x="148" y="482" font-size="14.5" fill="#1C271F">Group games into tournaments, add a video link per game, set player photos.</text>

  <!-- Video annotation editor tab -->
  <rect x="68" y="507" width="186" height="26" rx="13" fill="#E6F0E9"/>
  <text x="161" y="524" font-size="13" font-weight="700" text-anchor="middle" fill="#1F5A38">Video annotation editor</text>
  <text x="266" y="524" font-size="14.5" fill="#1C271F">Tag every pass, block and point, with the video in the page.</text>

  <!-- Line set up tab -->
  <rect x="68" y="549" width="102" height="26" rx="13" fill="#E6F0E9"/>
  <text x="119" y="566" font-size="13" font-weight="700" text-anchor="middle" fill="#1F5A38">Line set up</text>
  <text x="182" y="566" font-size="14.5" fill="#1C271F">Confirm the recurring lines and name them.</text>

  <!-- optional gold side path: sharing a game with a helper -->
  <rect x="68" y="598" width="744" height="152" rx="12" fill="#F6EEDC" stroke="#B67C15" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="88" y="622" font-size="11" font-weight="600" letter-spacing="1.2" fill="#8F5F0C">◆ OPTIONAL — SHARE A GAME WITH A HELPER</text>

  <!-- four little cards -->
  <g font-size="13">
    <rect x="88" y="638" width="150" height="92" rx="10" fill="#FFFDF7" stroke="#E3CFA6"/>
    <text x="102" y="660" font-weight="800" fill="#1C271F">Share for tagging</text>
    <text x="102" y="680" fill="#5A665C">Download a small</text>
    <text x="102" y="697" fill="#5A665C">game file and copy</text>
    <text x="102" y="714" fill="#5A665C">the message to send.</text>

    <rect x="258" y="638" width="190" height="92" rx="10" fill="#FFFDF7" stroke="#E3CFA6"/>
    <text x="272" y="660" font-weight="800" fill="#1C271F">Shared tagging site</text>
    <text x="272" y="680" fill="#5A665C">The helper opens the link,</text>
    <text x="272" y="697" fill="#5A665C">drops the file in, and tags</text>
    <text x="272" y="714" fill="#5A665C">in their own browser.</text>

    <rect x="468" y="638" width="150" height="92" rx="10" fill="#FFFDF7" stroke="#E3CFA6"/>
    <text x="482" y="660" font-weight="800" fill="#1C271F">Export JSON</text>
    <text x="482" y="680" fill="#5A665C">They send back one</text>
    <text x="482" y="697" fill="#5A665C">small annotations</text>
    <text x="482" y="714" fill="#5A665C">file.</text>

    <rect x="638" y="638" width="154" height="92" rx="10" fill="#FFFDF7" stroke="#E3CFA6"/>
    <text x="652" y="660" font-weight="800" fill="#1C271F">Upload tags</text>
    <text x="652" y="680" fill="#5A665C">Merge it into that</text>
    <text x="652" y="697" fill="#5A665C">game — other games</text>
    <text x="652" y="714" fill="#5A665C">can't be affected.</text>
  </g>
  <g fill="#B67C15">
    <path d="M242 684 L254 684 M248 678 L255 684 L248 690" stroke="#B67C15" stroke-width="2" fill="none"/>
    <path d="M452 684 L464 684 M458 678 L465 684 L458 690" stroke="#B67C15" stroke-width="2" fill="none"/>
    <path d="M622 684 L634 684 M628 678 L635 684 L628 690" stroke="#B67C15" stroke-width="2" fill="none"/>
  </g>

  <!-- ============ PUBLISH bridge ============ -->
  <line x1="440" y1="772" x2="440" y2="784" stroke="#2E7D4E" stroke-width="2" opacity="0.5"/>
  <rect x="362" y="784" width="156" height="34" rx="17" fill="#2E7D4E"/>
  <text x="440" y="807" font-size="15" font-weight="800" text-anchor="middle" fill="#FFFFFF">PUBLISH  ▾</text>
  <text x="440" y="838" font-size="12.5" text-anchor="middle" fill="#5A665C">Saved to the season's published folder · a snapshot — re-publish after any change.</text>
  <path d="M433 846 L447 846 L440 856 Z" fill="#2F6DB5"/>

  <!-- ============ TEAM REPORT panel ============ -->
  <rect x="44" y="864" width="792" height="136" rx="16" fill="#FCFBF6" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="68" y="894" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#1C3A5E">TEAM REPORT — READ-ONLY · MOBILE-FRIENDLY · WHAT YOUR TEAM OPENS</text>
  <line x1="68" y1="908" x2="812" y2="908" stroke="#E2E0D7" stroke-width="1"/>

  <!-- analysis row -->
  <rect x="68" y="922" width="152" height="26" rx="13" fill="#E7EFF8"/>
  <text x="144" y="939" font-size="13" font-weight="700" text-anchor="middle" fill="#1C3A5E">Every analysis tab</text>
  <text x="234" y="939" font-size="14" fill="#1C271F">Season · Players · Lines · Time Series · Field · Gender · Advanced · Raw data.</text>

  <!-- share row -->
  <rect x="68" y="960" width="108" height="26" rx="13" fill="#E7EFF8"/>
  <text x="122" y="977" font-size="13" font-weight="700" text-anchor="middle" fill="#1C3A5E">Share a view</text>
  <text x="190" y="977" font-size="14" fill="#1C271F">Copy a link that reopens the exact chart you're looking at.</text>

  <!-- footer tip -->
  <text x="44" y="1026" font-size="12.5" fill="#8B968B">Host the Team Report and send the link (or email the file) — opened off disk (file://), its videos, clips and photos can't load.</text>
</svg>
