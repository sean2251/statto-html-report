<svg width="880" height="940" viewBox="0 0 880 940" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Statto workflow: take stats, export the .statto file and run the script to build a Set up editor. In the desktop Set up editor you set up tournaments and video links, annotate the film (optionally splitting tagging across helpers), and set up your lines. Then you publish the read-only, mobile Team Report — with every analysis tab and shareable view links — which is what your team opens.">
  <!-- ground -->
  <rect x="1" y="1" width="878" height="938" rx="18" fill="#F5F3EC" stroke="#E2E0D7" stroke-width="1.5"/>

  <!-- header -->
  <text x="44" y="50" font-size="12" font-weight="600" letter-spacing="2.1" fill="#1F5A38">STATTO · SET UP EDITOR → TEAM REPORT</text>
  <text x="43" y="92" font-size="34" font-weight="800" letter-spacing="-0.6" fill="#1C271F">From field to Team Report</text>
  <text x="44" y="120" font-size="15" fill="#5A665C">One script builds a Set up editor. You author in it, then publish the read-only, mobile Team Report your team opens.</text>

  <!-- legend -->
  <circle cx="52" cy="150" r="6" fill="#2E7D4E"/>
  <text x="64" y="155" font-size="13" fill="#5A665C"><tspan font-weight="700" fill="#1C271F">Set up editor</tspan> — desktop, where you author</text>
  <rect x="406" y="145" width="10" height="10" rx="2" fill="#2F6DB5"/>
  <text x="424" y="155" font-size="13" fill="#5A665C"><tspan font-weight="700" fill="#1C271F">Team Report</tspan> — read-only, what your team opens</text>

  <!-- ============ inputs (green spine) ============ -->
  <line x1="78" y1="205" x2="78" y2="349" stroke="#2E7D4E" stroke-width="2" opacity="0.30"/>

  <!-- Step 1 -->
  <text x="116" y="199" font-size="17" font-weight="800" fill="#1C271F">Take stats during games</text>
  <text x="116" y="221" font-size="14.5" fill="#5A665C">Record passes, blocks and points in the Statto app.</text>
  <circle cx="78" cy="205" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="212" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">1</text>

  <!-- Step 2 -->
  <text x="116" y="271" font-size="17" font-weight="800" fill="#1C271F">Export the .statto file</text>
  <text x="116" y="293" font-size="14.5" fill="#5A665C">Save your season's export onto your computer.</text>
  <circle cx="78" cy="277" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="284" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">2</text>

  <!-- Step 3 -->
  <text x="116" y="343" font-size="17" font-weight="800" fill="#1C271F">Run the script</text>
  <text x="116" y="365" font-size="14.5" fill="#5A665C">One command builds your Set up editor, below.</text>
  <circle cx="78" cy="349" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="356" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">3</text>

  <!-- connector into editor panel -->
  <line x1="78" y1="349" x2="78" y2="396" stroke="#2E7D4E" stroke-width="2" opacity="0.30"/>

  <!-- ============ SET UP EDITOR panel ============ -->
  <rect x="44" y="396" width="792" height="268" rx="16" fill="#FCFBF6" stroke="#2E7D4E" stroke-width="1.5"/>
  <text x="68" y="426" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#1F5A38">SET UP EDITOR — DESKTOP · WHERE YOU AUTHOR</text>
  <line x1="68" y1="440" x2="812" y2="440" stroke="#E2E0D7" stroke-width="1"/>

  <!-- Set up tab -->
  <rect x="68" y="457" width="66" height="26" rx="13" fill="#E6F0E9"/>
  <text x="101" y="474" font-size="13" font-weight="700" text-anchor="middle" fill="#1F5A38">Set up</text>
  <text x="148" y="474" font-size="14.5" fill="#1C271F">Group games into tournaments, add a video link per game, set player photos.</text>

  <!-- Video annotation editor tab -->
  <rect x="68" y="499" width="186" height="26" rx="13" fill="#E6F0E9"/>
  <text x="161" y="516" font-size="13" font-weight="700" text-anchor="middle" fill="#1F5A38">Video annotation editor</text>
  <text x="266" y="516" font-size="14.5" fill="#1C271F">Step through the film and tag every pass, block and point.</text>

  <!-- Line set up tab -->
  <rect x="68" y="541" width="102" height="26" rx="13" fill="#E6F0E9"/>
  <text x="119" y="558" font-size="13" font-weight="700" text-anchor="middle" fill="#1F5A38">Line set up</text>
  <text x="182" y="558" font-size="14.5" fill="#1C271F">Confirm the recurring lines and name them.</text>

  <!-- optional gold side path -->
  <rect x="68" y="592" width="744" height="50" rx="12" fill="#F6EEDC" stroke="#B67C15" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="88" y="614" font-size="11" font-weight="600" letter-spacing="1.2" fill="#8F5F0C">◆ OPTIONAL — SPLIT THE TAGGING ACROSS PEOPLE</text>
  <text x="88" y="633" font-size="13.5" fill="#1C271F">Hand each helper a one-game tagging page; they tag &amp; export a JSON; you Upload it back to merge.</text>

  <!-- ============ PUBLISH bridge ============ -->
  <line x1="440" y1="664" x2="440" y2="676" stroke="#2E7D4E" stroke-width="2" opacity="0.5"/>
  <rect x="362" y="676" width="156" height="34" rx="17" fill="#2E7D4E"/>
  <text x="440" y="699" font-size="15" font-weight="800" text-anchor="middle" fill="#FFFFFF">PUBLISH  ▾</text>
  <text x="440" y="730" font-size="12.5" text-anchor="middle" fill="#5A665C">Preview it first · a point-in-time snapshot — re-publish after any change.</text>
  <path d="M433 738 L447 738 L440 748 Z" fill="#2F6DB5"/>

  <!-- ============ TEAM REPORT panel ============ -->
  <rect x="44" y="756" width="792" height="146" rx="16" fill="#FCFBF6" stroke="#2F6DB5" stroke-width="1.5"/>
  <text x="68" y="786" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#1C3A5E">TEAM REPORT — READ-ONLY · WHAT YOUR TEAM OPENS</text>
  <line x1="68" y1="800" x2="812" y2="800" stroke="#E2E0D7" stroke-width="1"/>

  <!-- analysis row -->
  <rect x="68" y="817" width="152" height="26" rx="13" fill="#E7EFF8"/>
  <text x="144" y="834" font-size="13" font-weight="700" text-anchor="middle" fill="#1C3A5E">Every analysis tab</text>
  <text x="234" y="834" font-size="14" fill="#1C271F">Season · Players · Lines · Time Series · Field · Gender · Advanced · Raw data.</text>

  <!-- share row -->
  <rect x="68" y="857" width="108" height="26" rx="13" fill="#E7EFF8"/>
  <text x="122" y="874" font-size="13" font-weight="700" text-anchor="middle" fill="#1C3A5E">Share a view</text>
  <text x="190" y="874" font-size="14" fill="#1C271F">Copy a link that reopens the exact chart you're looking at.</text>

  <!-- footer tip -->
  <text x="44" y="928" font-size="12.5" fill="#8B968B">⚠  Open the Team Report from a hosted link, not off disk (file://), so the videos, clips and photos load.</text>
</svg>
