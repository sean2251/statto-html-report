<svg width="880" height="900" viewBox="0 0 880 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="How Statto Stats works: take stats in Statto and export the .statto file. Upload it to your site as a team; each upload is its own team with its own address and passwords, and newer exports keep everything you've added. As the admin, in Season setup you group games into tournaments, add video links and photos, tag film and set up lines; it all saves to the site. Helpers sign in to the team's tagging hub with the tagger password, claim games and tag them, several at once, with tags and progress appearing live. Then publish the read-only, mobile Team Report, which your team opens at the team's address.">
  <!-- ground -->
  <rect x="1" y="1" width="878" height="898" rx="18" fill="#F5F3EC" stroke="#E2E0D7" stroke-width="1.5"/>

  <!-- header -->
  <text x="44" y="50" font-size="12" font-weight="600" letter-spacing="2.1" fill="#1F5A38">STATTO STATS · YOUR TEAMS' STATS WEBSITE</text>
  <text x="43" y="92" font-size="34" font-weight="800" letter-spacing="-0.6" fill="#1C271F">From Statto export to Team Report</text>
  <text x="44" y="120" font-size="15" fill="#5A665C">One site for every team and season: set it up, tag the film together, publish.</text>

  <!-- legend -->
  <circle cx="52" cy="150" r="6" fill="#2E7D4E"/>
  <text x="64" y="155" font-size="13" fill="#5A665C"><tspan font-weight="700" fill="#1C271F">Admin</tspan> — you</text>
  <rect x="200" y="145" width="10" height="10" rx="2" fill="#B67C15"/>
  <text x="218" y="155" font-size="13" fill="#5A665C"><tspan font-weight="700" fill="#1C271F">Video taggers</tspan> — helpers, tagger password</text>
  <rect x="520" y="145" width="10" height="10" rx="2" fill="#2F6DB5"/>
  <text x="538" y="155" font-size="13" fill="#5A665C"><tspan font-weight="700" fill="#1C271F">Team Report</tspan> — your team</text>

  <!-- ============ inputs (green spine) ============ -->
  <line x1="78" y1="205" x2="78" y2="277" stroke="#2E7D4E" stroke-width="2" opacity="0.30"/>

  <!-- Step 1 -->
  <text x="116" y="199" font-size="17" font-weight="800" fill="#1C271F">Take stats in Statto, export the .statto file</text>
  <text x="116" y="221" font-size="14.5" fill="#5A665C">Record passes, blocks and points, live or from film; export the whole team.</text>
  <circle cx="78" cy="205" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="212" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">1</text>

  <!-- Step 2 -->
  <text x="116" y="271" font-size="17" font-weight="800" fill="#1C271F">Upload it to your site as a team</text>
  <text x="116" y="293" font-size="14.5" fill="#5A665C"><tspan font-weight="700" fill="#1C271F">+ Upload new team</tspan>: its own address and passwords, e.g. …/t/ramp-2026/.</text>
  <text x="116" y="315" font-size="14.5" fill="#5A665C">Stat'd more games? <tspan font-weight="700" fill="#1C271F">Add newer Statto export</tspan> — everything you added stays put.</text>
  <circle cx="78" cy="277" r="21" fill="#2E7D4E" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="284" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">2</text>

  <!-- loop back from 2 to 1: more games -->
  <path d="M60 268 C 30 252, 30 228, 58 212" fill="none" stroke="#2E7D4E" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M54 206 L64 210 L57 218 Z" fill="#2E7D4E" opacity="0.6"/>

  <!-- connector into the setup panel -->
  <line x1="78" y1="298" x2="78" y2="350" stroke="#2E7D4E" stroke-width="2" opacity="0.30"/>

  <!-- ============ SEASON SETUP panel ============ -->
  <rect x="44" y="350" width="792" height="196" rx="16" fill="#FCFBF6" stroke="#2E7D4E" stroke-width="1.5"/>
  <text x="68" y="380" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#1F5A38">SEASON SETUP — ADMIN · SAVES TO THE SITE AS YOU GO</text>
  <line x1="68" y1="394" x2="812" y2="394" stroke="#E2E0D7" stroke-width="1"/>

  <rect x="68" y="411" width="66" height="26" rx="13" fill="#E6F0E9"/>
  <text x="101" y="428" font-size="13" font-weight="700" text-anchor="middle" fill="#1F5A38">Set up</text>
  <text x="148" y="428" font-size="14.5" fill="#1C271F">Group games into tournaments, add each game's video link, set player photos.</text>

  <rect x="68" y="453" width="186" height="26" rx="13" fill="#E6F0E9"/>
  <text x="161" y="470" font-size="13" font-weight="700" text-anchor="middle" fill="#1F5A38">Video annotation editor</text>
  <text x="266" y="470" font-size="14.5" fill="#1C271F">Tag film yourself, and watch helpers' tags arrive live.</text>

  <rect x="68" y="495" width="98" height="26" rx="13" fill="#E6F0E9"/>
  <text x="117" y="512" font-size="13" font-weight="700" text-anchor="middle" fill="#1F5A38">Line set up</text>
  <text x="180" y="512" font-size="14.5" fill="#1C271F">Name the 7-person lines you want to compare.</text>

  <!-- ============ TAGGING HUB panel (helpers) ============ -->
  <line x1="440" y1="546" x2="440" y2="582" stroke="#B67C15" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
  <rect x="44" y="582" width="792" height="128" rx="16" fill="#FBF6EA" stroke="#B67C15" stroke-width="1.5"/>
  <text x="68" y="612" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#8A5B0C">TAGGING HUB — HELPERS SIGN IN WITH THE TEAM'S TAGGER PASSWORD</text>
  <line x1="68" y1="626" x2="812" y2="626" stroke="#EADFC6" stroke-width="1"/>
  <text x="68" y="654" font-size="14.5" fill="#1C271F">Pick a game, claim it, tag it with the video right in the page. Several people can tag</text>
  <text x="68" y="677" font-size="14.5" fill="#1C271F">at once — even the same game — and see each other's progress live. Nothing to send back.</text>

  <!-- connector to publish -->
  <line x1="78" y1="710" x2="78" y2="768" stroke="#2F6DB5" stroke-width="2" opacity="0.35"/>

  <!-- Step 3: publish -->
  <circle cx="78" cy="774" r="21" fill="#2F6DB5" stroke="#F5F3EC" stroke-width="5"/>
  <text x="78" y="781" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">3</text>
  <text x="116" y="768" font-size="17" font-weight="800" fill="#1C271F">Publish the Team Report</text>
  <text x="116" y="790" font-size="14.5" fill="#5A665C">Read-only and mobile: season, every game, players, lines, field, time series, film clips.</text>
  <text x="116" y="812" font-size="14.5" fill="#5A665C">Your team opens <tspan font-weight="700" fill="#1C271F">…/t/ramp-2026/view</tspan> — with the viewer password, or open to anyone with the link.</text>

  <!-- footer -->
  <line x1="44" y1="846" x2="836" y2="846" stroke="#E2E0D7" stroke-width="1"/>
  <text x="44" y="874" font-size="13" fill="#5A665C">Runs on Cloudflare's free plan · one admin login for every team · each team's data kept separate</text>
</svg>
