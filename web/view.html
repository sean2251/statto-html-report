<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Report</title>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="center" id="loading"><p class="dim">Loading the Team Report…</p></div>
<script src="/site.js"></script>
<script>
(async function () {
  const status = await Site.requireRole('viewer');
  Site.renderBar(status, 'view'); // shown while loading and if nothing's published yet
  const r = await fetch(Site.base + '/api/report', { cache: 'no-store' });
  if (r.status === 401) { location.replace(Site.base + '/?next=' + encodeURIComponent(location.pathname) + '&role=viewer'); return; }
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    document.getElementById('loading').innerHTML = '';
    document.getElementById('loading').append(Site.el('p', {}, j.error || 'Couldn’t load the Team Report.'),
      Site.el('p', { class: 'dim' }, Site.el('a', { href: Site.base + '/' }, 'Back to the team site')));
    return;
  }
  // The published Team Report is a complete page; show it in place of this one,
  // with the site's top bar (drawn by the report itself, when published from a
  // version that knows how).
  const bar = '<script>window.__STATTO_SITE_BAR__=' + JSON.stringify(Site.barConfig(status, 'view')).replace(/</g, '\\u003c') + ';<\/script>\n';
  const html = (await r.text()).replace('<script id="report-data"', m => bar + m);
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
