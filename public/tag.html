<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagging hub</title>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="center" id="loading"><p class="dim">Loading…</p></div>

<div id="hub" hidden>
  <main>
    <h1 style="margin:8px 0 4px">Tagging hub</h1>
    <div id="flash" hidden></div>
    <p class="dim">Pick a game to tag. Your tags save as you go, and anyone can pick up where someone else left off — the list updates by itself.</p>
    <div class="row" style="margin:14px 0">
      <label style="flex-direction:row;align-items:center;gap:8px;font-weight:400"><input type="checkbox" id="hide-done"> Hide finished games</label>
    </div>
    <ul class="games" id="games"></ul>
  </main>
</div>

<script src="/site.js"></script>
<script src="/assets/stats.js"></script>
<script src="/assets/report-template.js"></script>
<script>
(async function () {
  const status = await Site.requireRole('tagger');
  Site.renderBar(status, 'tag'); // shown while loading, in the hub, and on any message
  const me = (status.session && status.session.name) || 'Admin';
  const isEditor = status.session && status.session.role === 'editor';
  let loaded;
  try { loaded = await Site.loadReport(); }
  catch (e) { document.getElementById('loading').textContent = e.message; return; }
  if (!loaded) {
    document.getElementById('loading').textContent = 'The season hasn’t been uploaded yet. Check back soon.';
    return;
  }
  const report = loaded.report;
  const teamName = status.teamName || loaded.teamName;

  // A game was chosen: open its tagging page right here.
  const gameId = new URLSearchParams(location.search).get('game');
  if (gameId) {
    const gi = report.games.findIndex(g => g.uuid === gameId);
    if (gi < 0) { location.replace(Site.base + '/tag'); return; }
    const [season, tags] = await Promise.all([Site.loadSeason(), Site.loadTags()]);
    const data = { setup: season.data && season.data.setup, annotations: tags.annotations };
    // Make sure the game shows as being worked on.
    Site.api('POST', '/api/claims', JSON.stringify({ game: gameId, action: 'touch' })).catch(() => {});
    Site.writeReportPage(report, 'vs ' + report.games[gi].opponent + ' — ' + teamName + ' tagging', {
      __STATTO_TAGONLY_GAME__: gi,
      __STATTO_SYNC__: { since: tags.seq, name: me, data },
      __STATTO_SITE_BAR__: Site.barConfig(status, 'tag'),
    });
    return;
  }

  document.getElementById('loading').hidden = true;
  document.getElementById('hub').hidden = false;
  const hideDone = document.getElementById('hide-done');
  try { hideDone.checked = localStorage.getItem('statto-hub-hide-done') === '1'; } catch (e) {}
  hideDone.addEventListener('change', () => { try { localStorage.setItem('statto-hub-hide-done', hideDone.checked ? '1' : '0'); } catch (e) {} render(); });

  const totals = new Map(report.games.map(g => [g.uuid,
    (g.points || []).reduce((n, pt) => n + (pt.passes || []).length + (pt.blocks || []).length, 0)]));
  let hub = { now: 0, games: {} };

  // ---- the admin's "Upload tags": an annotations file from before the site
  // (a helper's "Export annotations JSON", or a whole "custom data" export) ----
  // Only this game's events are taken, merged field by field into what's
  // already on the site (the file wins where both set the same field), so a
  // file for the wrong game can't touch other games.
  function gameKeys(g) {
    const keys = { passes: new Set(), blocks: new Set(), points: new Set() };
    (g.points || []).forEach(pt => {
      (pt.passes || []).forEach(p => p.uuid && keys.passes.add(p.uuid));
      (pt.blocks || []).forEach(b => b.uuid && keys.blocks.add(b.uuid));
      if (!pt.uuid) return;
      for (let d = 1; d <= (pt.defensivePossessions || 0); d++) {
        keys.points.add(pt.uuid + '#d' + d);
        keys.points.add(pt.uuid + '#o' + d);
      }
      keys.points.add(pt.uuid + '#pull');
    });
    return keys;
  }
  async function uploadTags(g, file) {
    let parsed;
    try { parsed = JSON.parse(await Site.readFile(file, 'text')); }
    catch (e) { Site.flash('That file isn’t valid JSON.', true); return; }
    const incoming = (parsed && parsed.statto === 'custom-data') ? parsed.annotations : parsed;
    if (!incoming || typeof incoming !== 'object' || !['passes', 'blocks', 'points'].some(k => incoming[k] && typeof incoming[k] === 'object')) {
      Site.flash('That isn’t an annotations file (from “Export annotations JSON” or “Export all custom data”).', true);
      return;
    }
    const keys = gameKeys(g);
    const current = (await Site.loadTags()).annotations;
    const changes = [];
    let skipped = 0;
    for (const kind of ['passes', 'blocks', 'points']) {
      for (const [key, rec] of Object.entries(incoming[kind] || {})) {
        if (!rec || typeof rec !== 'object' || !Object.keys(rec).length) continue;
        if (!keys[kind].has(key)) { skipped++; continue; }
        changes.push({ kind, key, game: g.uuid, data: Object.assign({}, current[kind][key], rec) });
      }
    }
    if (!changes.length) {
      Site.flash('None of the tags in that file are for vs ' + g.opponent + ' (' + g.dateDisplay + '). Check it’s the right game’s file.', true);
      return;
    }
    if (!confirm('Upload ' + changes.length + ' tagged event' + (changes.length === 1 ? '' : 's') + ' to vs ' + g.opponent + ' (' + g.dateDisplay + ')?' +
      (skipped ? '\n\n' + skipped + ' in the file are for other games and will be skipped.' : '') +
      '\n\nWhere an event is already tagged here, the file’s values replace the same fields; other fields are kept.')) return;
    try {
      for (let i = 0; i < changes.length; i += 400) {
        await Site.api('POST', '/api/tags', JSON.stringify({ changes: changes.slice(i, i + 400), upload: true }));
      }
      Site.flash('Uploaded ' + changes.length + ' tagged event' + (changes.length === 1 ? '' : 's') + ' to vs ' + g.opponent + '.' +
        (skipped ? ' Skipped ' + skipped + ' for other games.' : '') + ' Publish the Team Report again to include them there.');
      await refresh();
    } catch (e) { Site.flash('Couldn’t upload the tags: ' + e.message, true); }
  }
  function uploadButton(g) {
    const input = Site.el('input', { type: 'file', accept: '.json,application/json', hidden: true, class: 'upload-tags-input' });
    input.addEventListener('change', () => { const f = input.files[0]; input.value = ''; if (f) uploadTags(g, f); });
    const btn = Site.el('button', { type: 'button', title: 'Upload a tags file (.json) for this game', onclick: () => input.click() }, 'Upload tags');
    return [btn, input];
  }

  async function act(game, action) {
    try { hub = await Site.api('POST', '/api/claims', JSON.stringify({ game, action })); render(); }
    catch (e) { Site.flash(e.message, true); }
  }

  function render() {
    const ul = document.getElementById('games');
    ul.innerHTML = '';
    const { el } = Site;
    for (const g of report.games.slice().reverse()) {
      const h = hub.games[g.uuid] || { claim: null, tagged: 0, active: [], recent: [] };
      const claim = h.claim;
      const done = claim && claim.status === 'done';
      if (done && hideDone.checked) continue;
      const total = totals.get(g.uuid) || 0;
      const pct = total ? Math.min(100, Math.round(100 * h.tagged / total)) : 0;
      const live = h.active.filter(a => a.name !== me);
      const who = claim ? (done ? 'Finished by ' + claim.name : claim.name + ' is on it') : 'Nobody yet';
      const name = el('div', { class: 'name' }, ['vs ' + g.opponent]);
      if (done) name.append(el('span', { class: 'pill done' }, 'done'));
      if (live.length) name.append(el('span', { class: 'pill live' }, live.map(a => a.name).join(', ') + ' tagging now'));
      const meta = el('div', { class: 'meta' }, [g.dateDisplay + ' · ' + g.ourScore + '–' + g.oppScore + ' · ' + h.tagged + '/' + total + ' tagged · ' + who]);
      const barRow = el('div', { class: 'bar-track' }, el('div', { class: 'bar-fill', style: 'width:' + pct + '%' }));
      const actions = el('div', { class: 'actions' });
      const tagBtn = el('a', { class: 'btn primary', href: Site.base + '/tag?game=' + encodeURIComponent(g.uuid) }, h.tagged ? 'Continue' : 'Tag');
      actions.append(tagBtn);
      if (!claim || (claim.name !== me && !done)) actions.append(el('button', { type: 'button', onclick: () => act(g.uuid, 'claim') }, claim ? 'Take over' : 'Claim'));
      if (claim && !done && (claim.name === me || isEditor)) actions.append(el('button', { type: 'button', onclick: () => act(g.uuid, 'done') }, 'Mark done'));
      if (claim && (claim.name === me || isEditor)) actions.append(el('button', { type: 'button', onclick: () => act(g.uuid, done ? 'reopen' : 'release') }, done ? 'Reopen' : 'Release'));
      if (isEditor) actions.append(...uploadButton(g));
      ul.append(el('li', { class: 'game' }, [el('div', {}, [name, meta]), actions, barRow]));
    }
    if (!ul.children.length) ul.append(el('li', { class: 'dim' }, 'Every game is done. Nice work!'));
  }

  async function refresh() {
    try { hub = await Site.api('GET', '/api/hub'); render(); } catch (e) { /* keep the last view */ }
  }
  await refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 8000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
