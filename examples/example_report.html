<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample Ultimate Club — Season Report</title>
<meta name="color-scheme" content="dark light">
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('statto-report-theme'); } catch (e) {}
    var theme = stored || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  :root {
    /* neutral chrome -- dark theme (default) */
    --ink: #17181A;
    --ink-soft: #212226;
    --ink-rgb: 23,24,26;
    --chalk: #ECECEC;
    --chalk-dim: #9C9CA1;
    --chalk-rgb: 236,236,236;
    /* semantic accents: meaning-carrying, not brand-carrying (kept colorful per design decision) */
    --good: #4FD1AE;
    --good-rgb: 79,209,174;
    --bad: #E8604C;
    --bad-rgb: 232,96,76;
    /* the field diagram sits on a literal grass pitch, which stays constant regardless of site theme */
    --turf: #2E5339;
    --turf-deep: #1F3B27;
    --turf-line: rgba(243,241,233,0.35);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
    /* categorical colours for the mobile comparison bars -- mid-tone so they
       read on both the dark and light theme surfaces. One per compared entity. */
    --pc1: #46B58A; --pc2: #4E9BE0; --pc3: #E0952E; --pc4: #9B79EA;
    --pc5: #E06A85; --pc6: #35A9BA; --pc7: #A9A94A;
  }
  [data-theme="light"] {
    --ink: #F7F7F6;
    --ink-soft: #FFFFFF;
    --ink-rgb: 247,247,246;
    --chalk: #1A1A1A;
    --chalk-dim: #6B6B70;
    --chalk-rgb: 26,26,26;
    --good: #1F9D74;
    --good-rgb: 31,157,116;
    --bad: #C0392B;
    --bad-rgb: 192,57,43;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--chalk);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s ease, color 0.2s ease;
  }

  ::selection { background: var(--chalk); color: var(--ink); }

  a { color: inherit; }

  button:focus-visible,
  .game-card:focus-visible,
  .point-row:focus-visible {
    outline: 2px solid var(--chalk);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }


  /* ---------- top nav ---------- */
  header.topnav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(var(--ink-rgb),0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(var(--chalk-rgb),0.12);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 14px 20px;
    overflow-x: auto;
  }
  header.topnav .brand {
    font-weight: 800;
    letter-spacing: 0.02em;
    font-size: 15px;
    text-transform: uppercase;
    margin-right: 18px;
    white-space: nowrap;
    color: var(--chalk);
  }
  .nav-games-wrap { position: relative; display: inline-flex; }
  .nav-games-btn { display: inline-flex; align-items: center; gap: 5px; }
  .nav-caret { font-size: 9px; opacity: 0.7; }
  .nav-games-panel {
    display: none;
    position: fixed;
    background: var(--ink-soft);
    border: 1px solid rgba(var(--chalk-rgb),0.16);
    border-radius: 10px;
    padding: 6px;
    min-width: 250px;
    max-height: 70vh;
    overflow-y: auto;
    z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .nav-games-panel.open { display: block; }
  .nav-games-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    background: none;
    border: none;
    color: var(--chalk);
    font-family: var(--sans);
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
  }
  .nav-games-row:hover { background: rgba(var(--chalk-rgb),0.06); }
  .nav-games-row.active { background: rgba(var(--chalk-rgb),0.1); font-weight: 700; }

  /* Mobile sections menu (buildNavMenu): hidden on desktop; below the nav
     breakpoint it replaces the off-screen tab strip with one button showing
     the current section, opening a full list of tabs + games. */
  .nav-menu-wrap { display: none; position: relative; flex-shrink: 0; }
  .nav-menu-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(var(--chalk-rgb),0.06);
    border: 1px solid rgba(var(--chalk-rgb),0.22);
    color: var(--chalk);
    font-family: var(--sans); font-size: 13px; font-weight: 700;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
    max-width: 58vw;
  }
  .nav-menu-burger { font-size: 13px; line-height: 1; flex-shrink: 0; }
  .nav-menu-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-menu-panel {
    display: none; position: fixed;
    background: var(--ink-soft);
    border: 1px solid rgba(var(--chalk-rgb),0.16);
    border-radius: 12px; padding: 6px;
    max-height: 72vh; overflow-y: auto;
    z-index: 200; box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }
  .nav-menu-panel.open { display: block; }
  .nav-menu-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; background: none; border: none; color: var(--chalk);
    font-family: var(--sans); font-size: 14px; padding: 11px 12px;
    border-radius: 8px; cursor: pointer; text-align: left;
  }
  .nav-menu-row:hover { background: rgba(var(--chalk-rgb),0.06); }
  .nav-menu-row.active { background: rgba(var(--chalk-rgb),0.12); font-weight: 700; }
  .nav-menu-sep {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--chalk-dim); font-weight: 700; padding: 12px 12px 6px;
  }
  @media (max-width: 768px) {
    header.topnav button.tab, header.topnav .nav-games-wrap { display: none; }
    .nav-menu-wrap { display: inline-flex; }
    header.topnav .brand { min-width: 0; overflow: hidden; text-overflow: ellipsis; margin-right: 10px; }
  }
  .theme-toggle {
    margin-left: auto;
    flex-shrink: 0;
    background: transparent;
    border: 1px solid rgba(var(--chalk-rgb),0.2);
    color: var(--chalk);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .theme-toggle:hover { background: rgba(var(--chalk-rgb),0.08); border-color: var(--chalk); }
  header.topnav button.tab {
    background: transparent;
    border: 1px solid transparent;
    color: var(--chalk-dim);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  header.topnav button.tab:hover { color: var(--chalk); background: rgba(var(--chalk-rgb),0.06); }
  header.topnav button.tab.active { background: var(--chalk); color: var(--ink); }
  header.topnav button.tab .pill {
    display: inline-block;
    margin-left: 6px;
    font-family: var(--mono);
    font-size: 11px;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 700;
  }
  header.topnav button.tab .pill.W { background: rgba(var(--good-rgb),0.22); color: var(--good); }
  header.topnav button.tab .pill.L { background: rgba(var(--bad-rgb),0.22); color: var(--bad); }
  header.topnav button.tab .pill.T { background: rgba(var(--chalk-rgb),0.15); color: var(--chalk-dim); }

  main { max-width: 1100px; margin: 0 auto; padding: 40px 24px 100px; }
  section.view { display: none; }
  section.view.active { display: block; animation: fadein 0.35s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 11px;
    font-weight: 700;
    color: var(--chalk-dim);
    margin: 0 0 8px;
  }

  /* ---------- season hero ---------- */
  .hero-record {
    display: flex;
    align-items: baseline;
    gap: 22px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .hero-record .digits {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(56px, 10vw, 108px);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .hero-record .digits .w { color: var(--good); }
  .hero-record .digits .sep { color: var(--chalk-dim); padding: 0 6px; }
  .hero-record .digits .l { color: var(--bad); }
  .hero-diff { display: flex; flex-direction: column; align-items: flex-start; margin-left: 20px; }
  .hero-diff-value {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(20px, 2.5vw, 28px);
    line-height: 1;
    color: var(--chalk);
  }
  .hero-diff-value.good { color: var(--good); }
  .hero-diff-value.bad { color: var(--bad); }
  .hero-diff-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--chalk-dim);
    margin-top: 4px;
  }
  .hero-sub { color: var(--chalk-dim); font-size: 15px; margin-top: 0; }

  h2.section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--chalk-dim);
    border-top: 1px solid rgba(var(--chalk-rgb),0.14);
    padding-top: 14px;
    margin: 48px 0 20px;
  }
  .section-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--chalk-dim);
    border-top: 1px solid rgba(var(--chalk-rgb),0.14);
    padding-top: 14px;
    margin: 48px 0 20px;
  }
  .section-title-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 10px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--chalk-dim);
    background: none;
    border: none;
    border-top: 1px solid rgba(var(--chalk-rgb),0.14);
    padding: 14px 0 0;
    margin: 48px 0 20px;
    cursor: pointer;
    text-align: left;
  }
  .section-title-toggle:hover { color: var(--chalk); }
  .section-title-toggle-arrow {
    font-size: 11px;
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  .section-title-toggle.expanded .section-title-toggle-arrow { transform: rotate(90deg); }
  .game-filter { position: relative; text-transform: none; letter-spacing: normal; }
  .game-filter-btn {
    background: rgba(var(--chalk-rgb),0.06);
    border: 1px solid rgba(var(--chalk-rgb),0.2);
    color: var(--chalk);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .game-filter-btn:hover { background: rgba(var(--chalk-rgb),0.12); }
  .game-filter-panel {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: var(--ink-soft);
    border: 1px solid rgba(var(--chalk-rgb),0.16);
    border-radius: 10px;
    padding: 8px;
    min-width: 230px;
    max-height: 320px;
    overflow-y: auto;
    z-index: 60;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .game-filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--chalk);
    cursor: pointer;
    text-transform: none;
    letter-spacing: normal;
  }
  .game-filter-row:hover { background: rgba(var(--chalk-rgb),0.06); }
  .game-filter-row input[type="checkbox"] { accent-color: var(--chalk); cursor: pointer; }
  .game-filter-sep { height: 1px; background: rgba(var(--chalk-rgb),0.14); margin: 4px 2px; }
  .game-filter-row.disabled { opacity: 0.4; }
  .game-filter-row.disabled input,
  .game-filter-row.disabled { cursor: not-allowed; }
  .controls-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; text-transform: none; letter-spacing: normal; }

  .seg-toggle {
    display: inline-flex;
    /* Never wider than the container: a 5-option toggle (Film Clips "Show",
       Thrower-Receiver "Color by") used to run off a phone screen with its
       last option clipped. Capping here makes the buttons shrink/wrap to fit
       instead of pushing the page into a horizontal scroll. */
    max-width: 100%;
    border: 1px solid rgba(var(--chalk-rgb),0.2);
    border-radius: 999px;
    overflow: hidden;
  }
  .seg-btn {
    background: transparent;
    border: none;
    color: var(--chalk-dim);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    cursor: pointer;
    min-width: 0;
  }
  .seg-btn.active { background: var(--chalk); color: var(--ink); }
  /* On a phone a 5-option segmented pill can't fit one row without squeezing
     labels to breaking point. Break the single pill into a wrapping chip group:
     each option keeps its natural width and wraps to a new row as needed. */
  @media (max-width: 640px) {
    .seg-toggle { flex-wrap: wrap; gap: 6px; border: none; border-radius: 0; overflow: visible; }
    .seg-btn {
      border: 1px solid rgba(var(--chalk-rgb),0.22);
      border-radius: 999px;
      padding: 7px 13px;
    }
    .seg-btn.active { border-color: var(--chalk); }
  }

  .eff-widget { margin: 4px 0 8px; }
  .eff-gauges {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 32px;
    margin: 8px 0 18px;
  }
  .eff-gauge { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 160px; }
  .eff-ring {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: conic-gradient(var(--good) calc(var(--pct) * 1%), rgba(var(--chalk-rgb),0.14) 0);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .eff-ring-inner {
    width: 94px;
    height: 94px;
    border-radius: 50%;
    background: var(--ink-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .eff-pct { font-family: var(--mono); font-size: 22px; font-weight: 800; color: var(--chalk); }
  .eff-frac { font-family: var(--mono); font-size: 11.5px; color: var(--chalk-dim); margin-top: 2px; }
  .eff-label { font-size: 12px; font-weight: 600; color: var(--chalk-dim); text-align: center; line-height: 1.3; }
  .eff-toggle-row { display: flex; justify-content: center; }

  table.stats.compare { width: auto; min-width: 0; }
  table.compare th, table.compare td { text-align: center; padding-left: 20px; padding-right: 20px; }  table.compare th.row-label, table.compare td.row-label {
    text-align: left;
    font-family: var(--sans);
    font-weight: 600;
    color: var(--chalk-dim);
  }
  table.compare td.row-label { color: var(--chalk); }
  /* Row labels with a hover explanation: dotted underline + help cursor. */
  table.compare td.row-label.has-tip {
    cursor: help;
    text-decoration: underline dotted rgba(var(--chalk-rgb),0.4);
    text-underline-offset: 3px;
  }
  table.compare .rate-pct { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--chalk); }
  table.compare .rate-frac { font-size: 11px; color: var(--chalk-dim); margin-top: 2px; }

  /* ---- Comparison tables ----
     buildComparisonTable returns .compare-block. Blocks flagged { mobileCards }
     (.has-cards -- Line Analysis only) swap the table for stacked stat-bars on a
     phone. Every other comparison keeps the desktop table, but on a phone its
     row-label column is narrowed so more entity columns fit; a long label
     scrolls horizontally inside that narrow column (.row-label-inner). */
  .compare-block .compare-cards { display: none; }
  @media (max-width: 640px) {
    .compare-block.has-cards .table-scroll { display: none; }
    .compare-block.has-cards .compare-cards { display: block; }
    .compare-block:not(.has-cards) table.compare th.row-label,
    .compare-block:not(.has-cards) table.compare td.row-label {
      width: 27vw; max-width: 27vw; min-width: 66px;
      padding-left: 10px; padding-right: 10px;
    }
    .compare-block:not(.has-cards) table.compare .row-label-inner {
      display: block; white-space: nowrap;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    /* trim the entity columns' generous desktop padding so more fit on screen */
    .compare-block:not(.has-cards) table.compare th,
    .compare-block:not(.has-cards) table.compare td { padding-left: 12px; padding-right: 12px; }
  }
  .line-eff-compare { margin: 4px 0 10px; max-width: 640px; }
  .line-eff-compare .eff-toggle-row { margin-top: 14px; }
  .cmp-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 2px 2px 16px; }
  .cmp-key { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--chalk); }
  .cmp-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .cmp-row { padding: 12px 0; border-bottom: 1px solid rgba(var(--chalk-rgb), 0.08); }
  .cmp-row:last-child { border-bottom: 0; }
  .cmp-lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700; color: var(--chalk-dim); margin: 0 2px 9px; }
  .cmp-lbl.has-tip { cursor: help; }
  .cmp-hint { text-transform: none; letter-spacing: 0; font-weight: 500; opacity: 0.75; }
  .cmp-bar { display: grid; grid-template-columns: 5.2em 1fr auto; align-items: center; gap: 9px; margin: 6px 2px; }
  .cmp-nm { font-size: 12.5px; color: var(--chalk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmp-track { height: 9px; border-radius: 5px; background: rgba(var(--chalk-rgb), 0.1); overflow: hidden; }
  .cmp-fill { display: block; height: 100%; border-radius: 5px; min-width: 3px; }
  .cmp-fill.empty { min-width: 0; }
  .cmp-fill.neg { background: var(--bad); }
  .cmp-v { font-family: var(--mono); font-size: 12.5px; color: var(--chalk); min-width: 3em; text-align: right; }
  .cmp-bar.lead .cmp-v { font-weight: 700; }
  .cmp-bar.lead .cmp-v::after { content: " \25B2"; font-size: 8px; color: #D2982E; vertical-align: 1px; }
  .cmp-more { width: 100%; margin: 14px 0 2px; padding: 11px; background: transparent; border: 1px solid rgba(var(--chalk-rgb), 0.16); border-radius: 9px; color: var(--chalk-dim); font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; }
  .cmp-more:hover { color: var(--chalk); border-color: rgba(var(--chalk-rgb), 0.32); }
  /* rows that draw their own cell (mini histograms) stack per entity */
  .cmp-render { display: flex; align-items: center; gap: 10px; margin: 8px 2px; }
  .cmp-render .cmp-nm { flex: 0 0 5.2em; }
  .cmp-render-cell { flex: 1 1 auto; min-width: 0; }
  .cmp-render-cell svg { max-width: 100%; height: auto; }
  .impact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 4px;
  }
  .impact-card {
    background: var(--ink-soft);
    border: 1px solid rgba(var(--chalk-rgb),0.08);
    border-radius: 10px;
    padding: 14px;
  }
  .impact-card-name {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--chalk);
    text-align: center;
    margin-bottom: 10px;
  }
  .field-analysis-controls { margin: 4px 0 20px; }
  .gender-chart-wrap { display: flex; justify-content: center; margin: 8px 0; }
  .gender-raw-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .gender-raw-chart { flex: 1 1 300px; max-width: 340px; }
  .gender-explainer { max-width: 760px; margin: 0 0 24px; }
  .gender-explainer p {
    color: var(--chalk-dim);
    font-size: 13.5px;
    line-height: 1.6;
    margin: 0 0 12px;
  }
  /* Collapsible explainer (makeCollapsible): keeps a long how-to-read block
     from burying the chart on a phone. */
  .explainer-collapse { margin: 2px 0 20px; }
  .explainer-summary {
    cursor: pointer; list-style: none;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--sans); font-weight: 700; font-size: 13px;
    color: var(--chalk); padding: 8px 0;
  }
  .explainer-summary::-webkit-details-marker { display: none; }
  .explainer-summary::before {
    content: '\25B8'; font-size: 11px; color: var(--chalk-dim);
    transition: transform 0.15s ease;
  }
  .explainer-collapse[open] .explainer-summary::before { transform: rotate(90deg); }
  .explainer-collapse[open] .explainer-summary { margin-bottom: 6px; }
  .explainer-collapse > .gender-explainer { margin-bottom: 4px; }
  .rose-row { display: flex; gap: 10px; justify-content: center; }
  .rose-col { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0; }
  .rose-label { font-size: 11px; color: var(--chalk-dim); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
  .connections-grid { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .field-analysis-pitch-wrap { display: flex; justify-content: center; margin: 0 0 16px; }
  .field-analysis-export-row { display: flex; justify-content: center; margin-bottom: 20px; }
  .control-disabled { opacity: 0.35; pointer-events: none; }

  /* ---------- schedule cards ---------- */
  .schedule-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .game-card {

  .game-card .opp { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .game-card .date { color: var(--chalk-dim); font-size: 12px; margin-bottom: 12px; }
  .game-card .score-row { display: flex; align-items: center; justify-content: space-between; }
  .game-card .score { font-family: var(--mono); font-size: 22px; font-weight: 700; }
  .badge {
    font-family: var(--mono);

  }
  .badge.W { background: rgba(var(--good-rgb),0.18); color: var(--good); }
  .badge.L { background: rgba(var(--bad-rgb),0.18); color: var(--bad); }
  .badge.T { background: rgba(var(--chalk-rgb),0.12); color: var(--chalk-dim); }

  /* ---------- game hero (score bug) ---------- */
  .score-bug {
    display: flex;
    align-items: center;
    gap: 26px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .score-bug .side { text-align: center; }
  .score-bug .side .label { text-transform: uppercase; font-size: 11px; letter-spacing: 0.1em; color: var(--chalk-dim); margin-bottom: 4px; }
  .score-bug .num { font-family: var(--mono); font-weight: 700; font-size: clamp(48px, 9vw, 88px); line-height: 1; }
  .score-bug .num.us { color: var(--chalk); }
  .score-bug .dash { font-family: var(--mono); font-size: clamp(32px, 6vw, 56px); color: var(--chalk-dim); }

  /* ---------- game body: two columns ---------- */
  .game-grid {
    display: grid;
    grid-template-columns: minmax(440px, 520px) 1fr;
    gap: 28px;
    align-items: start;
    margin-top: 36px;
  }
  /* Desktop: transparent to layout, so pitch + film stay separate grid columns
     exactly as before. (A phone turns it into a pinned block -- see below.) */
  .game-focus { display: contents; }
  /* Once a game has tagged film the grid gains a third column. Three even
     columns don't fit the 1100px reading column, so this one block alone
     widens toward the viewport and re-centres itself. */
  .game-grid.has-film {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
    width: min(1400px, calc(100vw - 48px));
    margin-left: 50%;
    transform: translateX(-50%);
  }
  @media (max-width: 1180px) {
    /* Too narrow for three: film drops to a full-width row under the other two. */
    .game-grid.has-film { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
    .game-grid.has-film .film-strip { grid-column: 1 / -1; }
  }
  @media (max-width: 800px) {
    /* minmax(0,…) so a wide child (the point log's fixed columns) can't force
       the single column past the viewport and scroll the whole page. */
    .game-grid, .game-grid.has-film { grid-template-columns: minmax(0, 1fr); }
    .game-grid.has-film { width: auto; margin-left: 0; transform: none; } /* drop the desktop breakout */

    /* Solution A: the field diagram + tagged-events strip become one compact
       block pinned to the top of the screen while the point log scrolls below.
       Tapping a point updates the pinned diagram/strip in place. */
    .game-focus {
      display: flex; gap: 12px; align-items: flex-start;
      order: -1; position: sticky; top: 54px; z-index: 3;
      background: var(--ink); margin: 0 0 6px;
      padding: 8px 0 10px; border-bottom: 1px solid rgba(var(--chalk-rgb),0.12);
    }
    /* Fixed-width diagram column (so the long point caption wraps inside it
       instead of stretching it and starving the film strip). Portrait pitch, so
       the height follows the width. */
    .game-focus .pitch-wrap { position: static; top: auto; flex: 0 0 34vw; width: 34vw; margin: 0; }
    .game-focus .pitch-wrap svg { width: 100%; height: auto; max-width: none !important; margin: 0; }
    .game-focus .poss-tabs { justify-content: flex-start; }
    .game-focus .pitch-caption { font-size: 11px; margin: 6px 0 0; text-align: center; }
    /* the roster, legend and keyboard hint don't belong in a pinned mini-view
       (inline display toggles need !important to stay hidden here) */
    .game-focus .lineup-label, .game-focus .lineup-row,
    .game-focus .field-legend, .game-focus .kbd-hint { display: none !important; }
    .game-grid.has-film .game-focus .film-strip { flex: 1 1 0; min-width: 0; max-height: 46vh; overflow-y: auto; margin: 0; }
    .game-focus .film-head { flex-wrap: wrap; } /* let "Watch point" wrap in the narrow strip */
    .game-grid:not(.has-film) .game-focus { justify-content: center; }
    .game-grid:not(.has-film) .game-focus .pitch-wrap { flex-basis: 52vw; width: 52vw; }
    /* log scrolls with the page now (not its own box), so the pinned focus sticks */
    .point-log { max-height: none; overflow: visible; }
  }
  .point-log { max-height: 640px; overflow-y: auto; border: 1px solid rgba(var(--chalk-rgb),0.1); border-radius: 10px; }
  .point-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(var(--chalk-rgb),0.06);
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .point-row:last-child { border-bottom: none; }
  .point-row:hover { background: rgba(var(--chalk-rgb),0.05); }
  .point-row.selected { background: rgba(var(--chalk-rgb),0.08); }
  .point-row .pnum {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--chalk-dim);
    width: 24px;

  }
  .point-row .pscore { font-family: var(--mono); font-size: 13px; color: var(--chalk-dim); width: 48px; flex-shrink: 0;}
  .point-row .pdetail { font-size: 13px; flex: 1; min-width: 0; }
  .point-row .pdetail .goal { font-weight: 600; }
  .point-row .presult { font-family: var(--mono); font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }

  /* Sticky column-header row -- reuses the data rows' own column classes so
     widths line up automatically, with this class layered on top (higher
     specificity than the plain .point-row rules) to swap in header styling
     and turn off the click/hover affordance that a real row has. */
  .point-row.point-log-header {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--ink-soft);
    border-bottom: 1px solid rgba(var(--chalk-rgb),0.14);
    cursor: default;
  }
  .point-row.point-log-header:hover { background: var(--ink-soft); }
  .point-log-header .pnum, .point-log-header .pscore, .point-log-header .pdetail,
  .point-log-header .pline, .point-log-header .pleverage-head, .point-log-header .presult-head {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;

  .point-log-header .pleverage-head { width: 68px; box-sizing: border-box; flex-shrink: 0; }
  .point-log-header .presult-head { width: 22px; text-align: center; flex-shrink: 0; }

  .point-log-footnotes { line-height: 1.6; }
  /* Fixed widths (not just max-width caps) on every column, header and data
     alike, so rows actually line up like a table instead of the later
     columns nudging side to side with content length ("—" vs a long line
     name, "4.1" vs "10.0"). */
  .point-row .pleverage {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 68px;
    box-sizing: border-box;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--chalk-dim);
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(var(--chalk-rgb),0.06);
    border: 1px solid rgba(var(--chalk-rgb),0.16);

  }
  .point-row .pleverage-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .point-row .pline {
    font-size: 11px;
    color: var(--chalk-dim);
    width: 84px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .point-row .presult { width: 22px; text-align: center; }
  /* Phone: tighten the fixed columns so the flexible Result column keeps room
     and the Type header fits. Placed AFTER the base widths above so it wins. */
  @media (max-width: 640px) {
    .point-row { gap: 8px; padding: 10px 11px; }
    .point-row .pscore { width: 44px; }
    .point-row .pline { width: 56px; }
    .point-row .pleverage, .point-log-header .pleverage-head { width: 56px; }
    .point-row .presult, .point-log-header .presult-head { width: 32px; }
  }

  .pitch-wrap { position: sticky; top: 78px; }

  .poss-tab {
    background: rgba(var(--chalk-rgb),0.06);

  .lineup-label { color: var(--chalk-dim); font-size: 11px; margin: 14px 2px 6px; }

    display: inline-flex; align-items: baseline; gap: 5px;

  .diff-legend .swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* ---------- Time Series ---------- */
  .ts-controls { align-items: flex-end; gap: 10px 14px; }

  /* ---------- tables ---------- */
  .table-scroll { overflow-x: auto; border: 1px solid rgba(var(--chalk-rgb),0.1); border-radius: 10px; }
  /* Right-edge fade cueing that a wide table scrolls sideways (added in JS by

  .table-wrap { position: relative; }
  .table-fade-right {
    position: absolute; top: 1px; right: 1px; bottom: 1px; width: 34px;

  table.stats {

  .col-filter-input {

    font-weight: 400;
    text-transform: none;
    font-size: 11px;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .col-filter-input:focus { outline: none; border-color: var(--chalk); }
  table.stats tbody tr { border-bottom: 1px solid rgba(var(--chalk-rgb),0.06); }
  table.stats tbody tr:hover { background: rgba(var(--chalk-rgb),0.04); }
  table.stats td { font-family: var(--mono); }
  table.stats td:first-child { font-family: var(--sans); font-weight: 600; }

  footer {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 12px;
    padding: 30px 20px 50px;
  }

  /* ---------- line analysis ---------- */
  .line-mgmt { margin-bottom: 8px; }
  .line-scope-block {
    padding: 16px 0 4px;
    border-top: 1px solid rgba(var(--chalk-rgb),0.1);
  }
  .line-scope-block:first-child { border-top: none; padding-top: 0; }
  .line-scope-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--chalk);
    margin: 0 0 12px;
  }
  .line-scope-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 0 0 12px;
  }
  .line-scope-title-input {
    font-weight: 700;
    font-size: 13.5px;
    min-width: 220px;
  }
  .line-scope-dates { font-size: 11.5px; color: var(--chalk-dim); white-space: nowrap; }
  .line-confirmed {
    display: flex;

    gap: 4px;
    background: var(--ink-soft);

    padding: 12px 16px;
    margin-bottom: 10px;
  }
  .line-candidate-meta { font-size: 11.5px; color: var(--chalk-dim); }

  /* ---------- Line rosters (who's on each line + presence %) ---------- */
  .line-rosters { margin-bottom: 8px; }
  .line-roster-grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    margin-top: 4px;
  }
  .line-roster-card {
    background: var(--ink-soft);
    border: 1px solid rgba(var(--chalk-rgb),0.08);
    border-radius: 10px; padding: 12px 14px;
  }
  .line-roster-name { font-weight: 700; font-size: 13.5px; color: var(--chalk); }
  .line-roster-sub { font-size: 11px; color: var(--chalk-dim); margin-bottom: 8px; }
  .line-roster-list { display: flex; flex-direction: column; gap: 3px; }
  /* Each row is its own bar: a translucent fill sized to the presence %, with
     the name and figure sitting on top. */
  .line-roster-row {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 4px 8px; border-radius: 6px;
    background: rgba(var(--chalk-rgb),0.05);
    font-size: 12px;
  }
  .line-roster-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: rgba(var(--chalk-rgb),0.12);
    z-index: 0;
  }
  .line-roster-player, .line-roster-pct { position: relative; z-index: 1; }
  .line-roster-player { color: var(--chalk); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .line-roster-pct { color: var(--chalk-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* Shared players (on >1 of the shown lines) read gold, with a count chip. */
  .line-roster-row.shared .line-roster-fill { background: rgba(255,184,0,0.15); }
  .line-roster-row.shared .line-roster-player { color: #FFB800; }
  .line-roster-chip {
    font-size: 9px; font-weight: 800; line-height: 1;
    color: var(--ink); background: #FFB800;
    border-radius: 999px; padding: 2px 5px; font-variant-numeric: tabular-nums;
  }
  .line-name-input {
    background: rgba(var(--chalk-rgb),0.06);
    border: 1px solid rgba(var(--chalk-rgb),0.2);
    color: var(--chalk);
    font-family: var(--sans);
    font-size: 12.5px;
    padding: 6px 10px;
    border-radius: 999px;
    min-width: 160px;
  }
  .line-name-input:focus { outline: none; border-color: var(--chalk); }
  .line-confirmed-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .line-confirmed-head .line-name-input { flex: 1 1 auto; font-weight: 700; font-size: 13.5px; }
  .line-point-add-select {
    background: rgba(var(--chalk-rgb),0.06);
    border: 1px solid rgba(var(--chalk-rgb),0.2);
    color: var(--chalk);
    font-family: var(--sans);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 8px;

  }

  .line-matrix-instructions {
    margin: 0 0 14px;
    padding-left: 20px;
    color: var(--chalk-dim);
    font-size: 13px;
    line-height: 1.6;
  }
  .line-matrix-instructions li { margin-bottom: 4px; }
  .line-matrix-instructions li::marker { color: var(--chalk); font-weight: 700; }
  .line-matrix-visibility-row { margin-bottom: 10px; }

  /* Lineup matrix picker: points as rows, roster players as columns, a
     filled dot where that player was on the field. The first three columns
     (checkbox / point label / current line) stay pinned while the player
     columns scroll horizontally, and the header row stays pinned while rows
     scroll vertically -- explicit widths on all three keep their sticky
     left-offsets in sync (see line-matrix-cb/-label/-owner below). */
  .line-matrix-bulkbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .line-matrix-bulk-count { font-size: 12px; color: var(--chalk-dim); margin-right: 4px; }
  .line-matrix-bulk-group {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding-right: 12px;
    margin-right: 4px;
    border-right: 1px solid rgba(var(--chalk-rgb),0.14);
  }
  .line-matrix-bulk-group:last-child { border-right: none; padding-right: 0; margin-right: 0; }
  .line-matrix-scroll {
    max-height: 460px;
    overflow: auto;
    border: 1px solid rgba(var(--chalk-rgb),0.14);
    border-radius: 8px;
  }
  table.line-matrix { border-collapse: collapse; font-size: 12px; }
  table.line-matrix th, table.line-matrix td { padding: 0; text-align: center; white-space: nowrap; }
  table.line-matrix thead th {
    position: sticky;
    top: 0;
    background: var(--ink-soft);
    z-index: 2;
    font-size: 10.5px;
    color: var(--chalk-dim);
    font-weight: 700;
    border-bottom: 1px solid rgba(var(--chalk-rgb),0.14);
    padding: 6px 4px;
  }
  table.line-matrix .line-matrix-player-th { cursor: pointer; user-select: none; }
  table.line-matrix .line-matrix-player-th:hover { color: var(--chalk); }
  table.line-matrix .line-matrix-player-th.active { color: var(--ink); background: var(--good); font-weight: 800; }
  table.line-matrix .line-matrix-cb-th, table.line-matrix .line-matrix-cb {
    position: sticky; left: 0; width: 28px; min-width: 28px; max-width: 28px;
    background: var(--ink-soft); z-index: 1; text-align: center; padding: 6px 4px;
  }
  table.line-matrix td.line-matrix-cb { background: var(--ink); }
  table.line-matrix .line-matrix-label-th, table.line-matrix .line-matrix-label {
    position: sticky; left: 28px; width: 160px; min-width: 160px; max-width: 160px;
    background: var(--ink-soft); z-index: 1; text-align: left; font-family: var(--sans);
    overflow: hidden; text-overflow: ellipsis; padding: 6px 8px;
  }
  table.line-matrix td.line-matrix-label { background: var(--ink); color: var(--chalk); }
  table.line-matrix .line-matrix-owner-th, table.line-matrix .line-matrix-owner {
    position: sticky; left: 188px; width: 110px; min-width: 110px; max-width: 110px;
    background: var(--ink-soft); z-index: 1; text-align: left; font-size: 11px; color: var(--chalk-dim);
    overflow: hidden; text-overflow: ellipsis; padding: 6px 8px;
    border-right: 1px solid rgba(var(--chalk-rgb),0.14);
  }
  table.line-matrix td.line-matrix-owner { background: var(--ink); }
  table.line-matrix thead .line-matrix-cb-th, table.line-matrix thead .line-matrix-label-th, table.line-matrix thead .line-matrix-owner-th { z-index: 3; }
  table.line-matrix tbody tr.owned td.line-matrix-cb, table.line-matrix tbody tr.owned td.line-matrix-label, table.line-matrix tbody tr.owned td.line-matrix-owner { background: rgba(var(--good-rgb),0.06); }
  table.line-matrix tbody tr:hover td { background: rgba(var(--chalk-rgb),0.06); }
  table.line-matrix tbody tr.owned:hover td { background: rgba(var(--good-rgb),0.12); }
  /* Checked rows -- auto-suggested or manually picked -- get a visible
     highlight since chronological order no longer clusters a recurring
     group together, so the picked set has to read at a glance instead. */
  table.line-matrix tbody tr.picked td { background: rgba(var(--chalk-rgb),0.12); }
  table.line-matrix tbody tr.picked:hover td { background: rgba(var(--chalk-rgb),0.18); }
  table.line-matrix tbody tr.owned.picked td { background: rgba(var(--good-rgb),0.16); }
  table.line-matrix tbody tr.owned.picked:hover td { background: rgba(var(--good-rgb),0.22); }
  .line-matrix-cell { width: 22px; }
  .line-matrix-cell.present::after {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--chalk-dim);
  }
  table.line-matrix tbody tr.owned .line-matrix-cell.present::after { background: var(--good); }

  /* ---------- thrower-receiver analysis ---------- */
  .heatmap-toggle-row { overflow-x: auto; padding-bottom: 2px; }

    overflow-x: auto;
    margin: 12px 0 24px;
    padding-bottom: 4px;
  }
  .pair-rose-wrap { display: flex; justify-content: center; margin-top: 10px; }

  /* ---------- raw data ---------- */
  .export-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin: 4px 0 24px;
  }
  .export-card {
    background: var(--ink-soft);
    border: 1px solid rgba(var(--chalk-rgb),0.08);

  .export-card-title { font-size: 13px; font-weight: 700; color: var(--chalk); }
  .export-card-desc { font-size: 12px; color: var(--chalk-dim); margin: 0; line-height: 1.4; flex: 1 0 auto; }
  .export-card-count { font-size: 11px; color: var(--chalk-dim); opacity: 0.8; margin: 0 0 4px; }
  .export-card .csv-download { margin-top: 4px; align-self: flex-start; }

  /* ---------- Pill button (like .csv-download but without the download arrow) ---------- */
  .pill-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px;
    background: rgba(var(--chalk-rgb),0.08);

  /* ---------- Set up tab ---------- */
  .setup-tournament-list { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 4px; }
  .setup-tournament-row {
    display: flex; align-items: center; gap: 12px;

  }
  .setup-tournament-row .line-name-input { flex: 1; min-width: 0; }
  .setup-tournament-count { font-size: 12px; color: var(--chalk-dim); white-space: nowrap; }
  .setup-tournament-row .pill-btn { margin-top: 0; }

  table.stats.setup-games { width: 100%; }
  table.stats.setup-games th, table.stats.setup-games td { text-align: left; vertical-align: middle; }
  .setup-game-date { color: var(--chalk-dim); }
  .setup-select, .setup-video-input {
    background: rgba(var(--chalk-rgb),0.06);
    border: 1px solid rgba(var(--chalk-rgb),0.2);

    padding: 6px 8px; border-radius: 6px;
  }
  .setup-video-input { width: 100%; min-width: 180px; }
  .setup-select { cursor: pointer; }

  .setup-photo-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 16px; margin: 8px 0 24px;
  }
  .setup-photo-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: var(--ink-soft);
    border: 1px solid rgba(var(--chalk-rgb),0.08);
    border-radius: 12px; padding: 14px 10px;
  }
  .setup-avatar {
    width: 84px; height: 84px; border-radius: 50%;
    object-fit: cover; display: block;
    border: 2px solid rgba(var(--chalk-rgb),0.15);
  }
  .setup-avatar-placeholder {
    display: flex; align-items: center; justify-content: center;
    background: rgba(var(--chalk-rgb),0.08);
    color: var(--chalk-dim); font-weight: 700; font-size: 22px; letter-spacing: 0.02em;
  }
  .setup-photo-name { font-size: 12.5px; font-weight: 600; text-align: center; color: var(--chalk); }
  .setup-photo-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .setup-photo-actions .pill-btn { margin-top: 0; padding: 5px 11px; }

  /* ---------- Photo cropper modal ---------- */
  .cropper-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .cropper-dialog {
    background: var(--ink); color: var(--chalk);
    border: 1px solid rgba(var(--chalk-rgb),0.16);
    border-radius: 14px; padding: 20px;
    display: flex; flex-direction: column; gap: 14px; align-items: center;
    max-width: 100%;
  }
  .cropper-title { font-size: 14px; font-weight: 700; }
  .cropper-viewport {
    position: relative; overflow: hidden; border-radius: 8px;
    background: #000; cursor: grab; touch-action: none;
    max-width: 100%;
  }
  .cropper-viewport:active { cursor: grabbing; }
  .cropper-img { position: absolute; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .cropper-ring {
    position: absolute; inset: 0; border-radius: 50%;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.85);
    pointer-events: none;
  }
  .cropper-zoom-row { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 12px; color: var(--chalk-dim); }
  .cropper-zoom { flex: 1; accent-color: var(--chalk); cursor: pointer; }
  .cropper-actions { display: flex; gap: 10px; }
  .cropper-actions .pill-btn { margin-top: 0; }
  .cropper-save { background: rgba(var(--good-rgb),0.15); border-color: rgba(var(--good-rgb),0.5); color: var(--good); }
  .cropper-save:hover { background: rgba(var(--good-rgb),0.25); border-color: var(--good); }

  /* ---------- Team-photo tagger modal ---------- */
  .tagger-dialog { max-width: min(840px, 96vw); }
  .tagger-body { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 100%; }
  .tagger-choose { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 8px; }
  .tagger-choose .pitch-caption { max-width: 360px; text-align: center; }
  .tagger-help { max-width: 620px; text-align: center; margin: 0; }
  .tagger-stage {
    position: relative; overflow: visible; border-radius: 8px;
    background: #000; touch-action: none; max-width: 100%;
    box-shadow: 0 0 0 1px rgba(var(--chalk-rgb),0.15);
  }
  .tagger-img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; border-radius: 8px; }
  .tagger-circle {
    position: absolute; border-radius: 50%; box-sizing: border-box;
    border: 2px dashed rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.06);
    cursor: move; touch-action: none;
    --tag-color: #4FD1AE;
  }
  .tagger-circle.tagged-named {
    border-style: solid; border-color: var(--tag-color);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.35);
  }
  .tagger-handle {
    position: absolute; right: -7px; bottom: -7px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--tag-color, #4FD1AE); border: 2px solid #000;
    cursor: nwse-resize;
  }
  .tagger-remove {
    position: absolute; top: -9px; right: -9px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--bad); color: #fff; border: 1px solid #000;
    font-size: 13px; line-height: 1; padding: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .tagger-name {
    position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%);
    white-space: nowrap;
  }
  .tagger-name-select {
    font-size: 11px; padding: 2px 4px; max-width: 130px;
    background: var(--ink); color: var(--chalk);
    border: 1px solid rgba(var(--chalk-rgb),0.3); border-radius: 6px;
    cursor: pointer;
  }

  /* ---------- Data Editor ---------- */
  .de-game-row { align-items: center; gap: 10px; }
  .de-inline-label { font-size: 12px; font-weight: 700; color: var(--chalk-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .de-game-select { min-width: 240px; }
  .de-game-fixed { font-weight: 700; color: var(--chalk); }
  .setup-tag-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .setup-tag-actions .pill-btn { margin-top: 0; padding: 5px 10px; }
  .setup-tag-count { font-size: 11.5px; color: var(--chalk-dim); font-family: ui-monospace, monospace; white-space: nowrap; }
  /* Video | field | tag panel. Deliberately not equal thirds -- each column has
     a different natural shape: the video is 16:9 and wants the leftover width,
     the field is portrait (110x40, so 2.75x taller than wide) and must stay
     narrow or it grows taller than the screen, and the panel is a fixed-width
     form. `auto` on the middle column lets the field's own resize handle set
     its width, with the video column absorbing the difference.
     align-items: stretch (not start) is what gives the sticky tag panel room
     to travel -- a column sized to its own content has none. */
  .de-layout {
    display: grid;
    /* Five columns: a flexible spacer, the resizable video, the resizable
       field, the fixed panel, and a second flexible spacer. Video and field
       are auto columns sized by their own drag widths (.de-video-resize /
       .de-pitch); the 1fr spacers absorb the slack and keep the trio centred,
       so growing or shrinking either pane never fights a neighbour. The block
       breaks out past the ~1100px reading column via a negative margin (not a
       transform, which would reparent the sticky tag panel's containing block). */
    grid-template-columns: minmax(0, 1fr) auto auto minmax(300px, 370px) minmax(0, 1fr);
    gap: 20px; align-items: stretch; margin-top: 8px;
    width: min(1760px, calc(100vw - 40px));
    margin-left: calc((100% - min(1760px, calc(100vw - 40px))) / 2);
  }
  .de-video-col { grid-column: 2; }
  .de-field-col { grid-column: 3; }
  .de-right { grid-column: 4; }
  /* Too narrow for three: the panel drops to a full-width row underneath. */
  /* Too narrow for the full row: the panel drops to a full-width row underneath
     and the spacers collapse away (reset the explicit column placements the
     desktop rule set, so video/field auto-place into the two real columns). */
  @media (max-width: 1180px) {
    .de-layout { grid-template-columns: minmax(0, 1fr) auto; }
    .de-layout .de-video-col { grid-column: 1; }
    .de-layout .de-field-col { grid-column: 2; }
    .de-layout .de-right { grid-column: 1 / -1; }
  }
  @media (max-width: 860px) {
    .de-layout { grid-template-columns: 1fr; }
    .de-layout .de-video-col,
    .de-layout .de-field-col,
    .de-layout .de-right { grid-column: auto; }
  }
  /* Below the breakout width there's nothing to break out of. */
  @media (max-width: 1150px) {
    .de-layout { width: auto; margin-left: 0; }
  }
  .de-video-col { min-width: 0; }
  .de-field-col { min-width: 0; }
  .de-right { min-width: 0; }
  /* The middle column is auto-sized, so its widest child sets its width. Cap
     the captions/hints or a long sentence stretches the column well past the
     pitch and pushes the tag panel away from the field. */
  .de-field-col .de-pitch-hint,
  .de-field-col .kbd-hint,
  .de-field-col .de-step-caption { max-width: 340px; margin-left: auto; margin-right: auto; }
  /* Drag the bottom-right corner to resize the player. Only the width is
     draggable; the host's 16:9 aspect-ratio fixes the height, so it follows
     and the video can't be stretched out of shape -- same deal as .de-pitch. */
  .de-video-resize {
    resize: horizontal;
    overflow: hidden;
    width: 720px;
    min-width: 300px;
    /* Cap so a fully-grown video still leaves room for the field + panel in the
       breakout row rather than overlapping them (790px ≈ default field + panel
       + the row's gaps). max() keeps it above the min on narrow viewports. */
    max-width: max(300px, calc(min(1760px, 100vw - 40px) - 790px));
    margin-bottom: 4px;
  }
  .de-player-host {
    width: 100%; aspect-ratio: 16 / 9; background: #000;
    border-radius: 10px; overflow: hidden;
  }
  .de-video-resize .de-player-host { margin-bottom: 0; }
  .de-player-host iframe { width: 100%; height: 100%; border: 0; display: block; }
  .de-no-video { margin: 0 0 12px; }
  .de-player-note { margin: 0 0 12px; }
  .de-watch-inline { color: var(--good); text-decoration: none; white-space: nowrap; }
  .de-watch-inline:hover { text-decoration: underline; }
  /* .pitch-wrap is sticky so the game page's diagram stays put beside its long
     point log. Here the caption, Prev/Next and the tip all sit *below* the
     diagram in the same column, so sticking makes the field slide down over
     them -- keep it in normal flow. */
  .de-pitch {

     needs !important. Scoped to the tagging pitch only -- every other field
     diagram keeps its inline cap. */
  .de-pitch svg { max-width: none !important; width: 100%; height: auto; }
  .de-pitch-hint { text-align: center; margin: 0 0 8px; font-size: 10.5px; color: var(--chalk-dim); opacity: 0.6; }
  .de-step-caption { text-align: center; margin: 0 0 8px; font-weight: 600; color: var(--chalk); }
  .de-step-nav { align-items: center; justify-content: center; gap: 14px; }
  .de-step-counter { font-family: ui-monospace, monospace; font-size: 12px; color: var(--chalk-dim); min-width: 60px; text-align: center; }

  /* The panel and its shortcut legend stick together as one block. Sticking
     the panel alone let it slide over the legend sitting below it. */
  .de-panel-stack { position: sticky; top: 74px; }
  .de-panel {
    background: var(--ink-soft);
    border: 1px solid rgba(var(--chalk-rgb),0.1);
    border-radius: 12px; padding: 16px;
  }
  .de-panel-head { margin-bottom: 12px; }
  .de-panel-title { font-size: 15px; font-weight: 700; color: var(--chalk); }
  .de-panel-sub { font-size: 12px; color: var(--chalk-dim); margin-top: 2px; }
  .de-point-field {
    display: flex; flex-direction: column; gap: 6px;
    padding-bottom: 12px; margin-bottom: 12px;
    border-bottom: 1px dashed rgba(var(--chalk-rgb),0.16);
  }
  .de-defposs-row { display: flex; align-items: center; gap: 8px; }
  .de-defposs-label {
    font-size: 11px; font-family: ui-monospace, monospace; color: var(--chalk-dim);
    min-width: 46px; flex: 0 0 auto;
  }
  .de-defposs-row .de-select { flex: 1; }
  .de-field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .de-field { display: flex; flex-direction: column; gap: 4px; }
  .de-field-wide { margin-top: 12px; }
  .de-field-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--chalk-dim); }
  .de-field-note { margin: 6px 0 0; font-size: 11px; line-height: 1.45; color: var(--chalk-dim); opacity: 0.8; }
  .de-select, .de-ts-input, .de-notes {
    background: var(--ink); color: var(--chalk);
    border: 1px solid rgba(var(--chalk-rgb),0.22); border-radius: 8px;
    padding: 6px 8px; font-size: 13px; font-family: inherit; width: 100%;
  }
  .de-select { cursor: pointer; }
  .de-notes { resize: vertical; }
  .de-multi-box { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .de-multi-option {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--chalk); cursor: pointer;
    white-space: nowrap;
  }
  .de-multi-option input[type="checkbox"] { cursor: pointer; accent-color: var(--good); }
  .de-ts-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .de-ts-input { width: 90px; flex: 0 0 auto; }
  .de-ts-row .pill-btn { margin-top: 0; }
  .de-ts-row .pill-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .de-io-row { align-items: center; gap: 10px; margin-top: 20px; }
  .de-tagged-count { font-size: 12px; color: var(--chalk-dim); }
  .de-mode-row { margin: 4px 0 14px; }

  /* Data Editor -- Query pane */
  .de-query-top { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; margin-bottom: 14px; }
  .de-qfield { display: flex; flex-direction: column; gap: 5px; }
  .de-query-filters { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 16px; }
  .de-query-filters .de-select { min-width: 120px; }
  .de-query-summary-row { align-items: center; justify-content: space-between; gap: 12px; }
  .de-query-summary { font-weight: 700; color: var(--chalk); font-size: 13.5px; }
  .de-query-results { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .de-result-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 8px 12px; background: var(--ink-soft);
    border: 1px solid rgba(var(--chalk-rgb),0.08); border-radius: 8px; font-size: 13px;
  }
  .de-result-meta { color: var(--chalk); }
  .de-result-tags { color: var(--chalk-dim); font-size: 12px; flex: 1 1 120px; }
  .de-result-link { margin-left: auto; font-family: ui-monospace, monospace; color: var(--good); text-decoration: none; white-space: nowrap; }
  .de-result-link:hover { text-decoration: underline; }
  .de-result-nolink { margin-left: auto; color: var(--chalk-dim); font-size: 12px; white-space: nowrap; }

  /* ---------- Data Editor: keyboard shortcut legend ---------- */
  .de-shortcuts {
    margin-top: 14px; padding: 12px 14px;
    border: 1px solid rgba(var(--chalk-rgb),0.12); border-radius: 10px;
    background: rgba(var(--chalk-rgb),0.03);
  }
  .de-shortcuts-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    font-weight: 700; color: var(--chalk-dim); margin-bottom: 8px;
  }
  .de-shortcut-list { display: flex; flex-direction: column; gap: 7px; }
  .de-shortcut { display: flex; align-items: baseline; gap: 10px; }
  .de-shortcut kbd {
    flex: none; min-width: 26px; text-align: center;
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    color: var(--chalk); background: rgba(var(--chalk-rgb),0.1);
    border: 1px solid rgba(var(--chalk-rgb),0.2); border-bottom-width: 2px;
    border-radius: 5px; padding: 2px 6px;
  }
  .de-shortcut-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .de-shortcut-name { font-size: 12.5px; font-weight: 600; color: var(--chalk); }
  .de-shortcut-tags { font-size: 11px; line-height: 1.4; color: var(--chalk-dim); }
  .de-shortcut-note {
    margin: 10px 0 0; font-size: 11px; line-height: 1.45;
    color: var(--chalk-dim); opacity: 0.8;
  }

  /* ---------- Possession-length histograms (Line Analysis) ---------- */
  .histo-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .histo-svg { display: block; max-width: 100%; height: auto; }
  .histo-foot {
    font-family: var(--mono); font-size: 9.5px; color: var(--chalk-dim);
    white-space: nowrap; opacity: 0.85;
  }
  .histo-empty { color: var(--chalk-dim); opacity: 0.6; }

  /* ---------- Guided tour overlay (team report) ---------- */
  /* The dim is a single huge box-shadow spilling out of the highlight box, so
     there's no four-panel frame to keep in sync as the target moves. The
     backdrop underneath is what actually swallows clicks. */
  .tour-backdrop { position: fixed; inset: 0; z-index: 3000; background: transparent; }
  .tour-hole {
    position: fixed; z-index: 3001; pointer-events: none;
    border-radius: 10px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.62), 0 0 0 2px var(--chalk) inset;
    transition: top 0.18s ease, left 0.18s ease, width 0.18s ease, height 0.18s ease;
  }
  /* Intro steps point at nothing: collapsed to a point, so the same shadow
     dims the screen evenly with no highlight ring showing. */
  .tour-hole-empty { box-shadow: 0 0 0 9999px rgba(0,0,0,0.62); transition: none; }
  .tour-pop {
    position: fixed; z-index: 3002;
    width: min(330px, calc(100vw - 32px));
    background: var(--ink-soft);
    border: 1px solid rgba(var(--chalk-rgb),0.18);
    border-radius: 12px;
    padding: 14px 16px 12px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.4);

  .tour-pop-centered { top: 50% !important; left: 50% !important; transform: translate(-50%,-50%); }
  .tour-count {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--chalk-dim); margin-bottom: 5px;

    margin-right: auto;

  .tour-skip:hover { color: var(--chalk); text-decoration: underline; }
  .tour-btn {
    font-family: var(--sans); font-size: 12.5px; font-weight: 600;
    border-radius: 999px; padding: 7px 16px; cursor: pointer;
    border: 1px solid rgba(var(--chalk-rgb),0.2);
    background: transparent; color: var(--chalk);

  .pass-node-ring { pointer-events: none; }

  .game-watch-wrap { margin: 4px 0 8px; }
  .game-watch-link {

  .game-watch-link:hover { background: rgba(var(--chalk-rgb),0.16); border-color: var(--chalk); }

  /* Line Analysis: static tournament heading (rename moved to Set up) */
  .line-scope-title { font-size: 16px; font-weight: 700; color: var(--chalk); }

// Game sections are built once at init() and just shown/hidden by class
// toggle (never rebuilt), but the "Line" column on each point row depends
// on Line Analysis's curated lines, which live in localStorage and can
// change *after* this game page was built -- e.g. the user names a line,
// then switches straight to a game page in the same session without a
// reload. Each buildGameSection registers a refresher here so showView can
// re-pull the current lines data and update the column live on every visit.
const gameViewRefreshers = new Map();

// Every analysis tab reads the tournament setup (its game filter groups its
// games by tournament; Line Analysis scopes lines by tournament). Those tabs
// are built once at init and never rebuilt, so a tournament change made on
// the Set up tab wouldn't otherwise reach them without a full page reload.
// Instead we track a revision that bumps on every tournament edit, register
// each tab's build function here, and -- when you click into a tab whose
// content predates the latest edit -- rebuild just that tab from current
// data. Tabs you haven't touched since the edit keep all their in-tab state
// (selected players, filter picks); the disruptive rebuild only happens on
// the first visit after an actual change.
let tournamentsRevision = 0;
const rebuildableViews = new Map(); // id -> { buildFn, revision }

function mountRebuildableView(buildFn) {
  const section = buildFn();
  document.getElementById('main').appendChild(section);
  rebuildableViews.set(section.id, { buildFn, revision: tournamentsRevision });
}

function showView(id) {
  const rv = rebuildableViews.get(id);
  if (rv && rv.revision !== tournamentsRevision) {
    const old = document.getElementById(id);
    if (old && old.parentNode) {
      const fresh = rv.buildFn();
      old.parentNode.replaceChild(fresh, old);
    }
    rv.revision = tournamentsRevision;
  }
  document.querySelectorAll('section.view').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('header.topnav button.tab').forEach(b => {
    if (b.classList.contains('nav-games-btn')) {
      b.classList.toggle('active', id.startsWith('game-'));
    } else {
      b.classList.toggle('active', b.getAttribute('data-target') === id);
    }
  });
  document.querySelectorAll('.nav-games-row').forEach(r => r.classList.toggle('active', r.getAttribute('data-target') === id));
  if (navMenuWrap) navMenuWrap.__setActive(id);
  if (gameViewRefreshers.has(id)) gameViewRefreshers.get(id)();
  // Recompute scroll-fade cues for this view's tables now they're measurable
  // (a table built while hidden had 0 width) -- backs up the ResizeObserver.
  const shown = document.getElementById(id);
  if (shown) shown.querySelectorAll('.table-scroll').forEach(sc => { if (sc.__updateAff) sc.__updateAff(); });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  // A tour in progress belongs to the tab you just left.
  endTour();
  maybeAutoTour(id);
}

// ---------- Sortable stats tables & CSV export ----------
// comboCountKey (optional, row required): folds a companion count column
// (e.g. huck completions) into this percentage cell as "23 (68%)" instead
// of a separate column -- the attempts/completions/% triplet only needs the
// attempts column (volume) and this merged cell (efficiency); the raw count
// stays visible, just no longer independently sortable.
function formatCell(v, col, row) {
  if (v === null || v === undefined) return '–';
  if (typeof v === 'number') {
    const n = Number.isInteger(v) ? v : Math.round(v * 100) / 100;
    if (col && col.percent) {
      if (col.comboCountKey && row && row[col.comboCountKey] != null) {
        return `${row[col.comboCountKey]} (${n}%)`;
      }
      return `${n}%`;
    }
    return String(n);
  }
  return v;
}

function csvCell(v) {
  if (v === null || v === undefined) return '';
  let s;
  if (typeof v === 'number') {
    s = Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100);
  } else {
    s = String(v);
  }
  if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function slug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'data';
}

// Shared by CSV export and Line Analysis's lines.json export.
function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename }, []);
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---------- Minimal ZIP writer (store-only) ----------
// Just enough of the ZIP spec to bundle the player photos into one download.
// No compression: the entries are PNGs, which are already deflate-compressed,
// so storing them costs nothing and keeps this to a few dozen lines with no
// external library (the report has to stay a single self-contained file).
const CRC32_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC32_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// files: [{ name, data: Uint8Array }] -> Uint8Array of a .zip
function buildZip(files) {
  const enc = new TextEncoder();
  const entries = files.map(f => ({ name: enc.encode(f.name), data: f.data, crc: crc32(f.data) }));
  const localSize = entries.reduce((s, e) => s + 30 + e.name.length + e.data.length, 0);
  const centralSize = entries.reduce((s, e) => s + 46 + e.name.length, 0);
  const out = new Uint8Array(localSize + centralSize + 22);
  const dv = new DataView(out.buffer);
  let p = 0;
  entries.forEach(e => {
    e.offset = p;
    dv.setUint32(p, 0x04034b50, true);      // local file header
    dv.setUint16(p + 4, 20, true);          // version needed
    dv.setUint16(p + 6, 0, true);           // flags
    dv.setUint16(p + 8, 0, true);           // method: stored
    dv.setUint16(p + 10, 0, true);          // mod time
    dv.setUint16(p + 12, 0x21, true);       // mod date (1980-01-01: no clock in a zip we regenerate)
    dv.setUint32(p + 14, e.crc, true);
    dv.setUint32(p + 18, e.data.length, true);
    dv.setUint32(p + 22, e.data.length, true);
    dv.setUint16(p + 26, e.name.length, true);
    dv.setUint16(p + 28, 0, true);          // extra length
    p += 30;
    out.set(e.name, p); p += e.name.length;
    out.set(e.data, p); p += e.data.length;
  });
  const centralStart = p;
  entries.forEach(e => {
    dv.setUint32(p, 0x02014b50, true);      // central directory header
    dv.setUint16(p + 4, 20, true);          // version made by
    dv.setUint16(p + 6, 20, true);          // version needed
    dv.setUint16(p + 8, 0, true);
    dv.setUint16(p + 10, 0, true);
    dv.setUint16(p + 12, 0, true);
    dv.setUint16(p + 14, 0x21, true);
    dv.setUint32(p + 16, e.crc, true);
    dv.setUint32(p + 20, e.data.length, true);
    dv.setUint32(p + 24, e.data.length, true);
    dv.setUint16(p + 28, e.name.length, true);
    dv.setUint16(p + 30, 0, true);          // extra
    dv.setUint16(p + 32, 0, true);          // comment
    dv.setUint16(p + 34, 0, true);          // disk number
    dv.setUint16(p + 36, 0, true);          // internal attrs
    dv.setUint32(p + 38, 0, true);          // external attrs
    dv.setUint32(p + 42, e.offset, true);
    p += 46;
    out.set(e.name, p); p += e.name.length;
  });
  dv.setUint32(p, 0x06054b50, true);        // end of central directory
  dv.setUint16(p + 8, entries.length, true);
  dv.setUint16(p + 10, entries.length, true);
  dv.setUint32(p + 12, centralStart ? p - centralStart : 0, true);
  dv.setUint32(p + 16, centralStart, true);
  return out;
}

// "data:image/png;base64,...." -> raw bytes
function dataUrlToBytes(dataUrl) {
  const bin = atob(String(dataUrl).split(',')[1] || '');
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function playerPhotoFiles() {

    name: 'photos/' + slug(name) + '.png',
