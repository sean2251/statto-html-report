# Builds "Statto Reports.app" (Apple Silicon) with PyInstaller.
#
# - Every run uploads the zipped app as a workflow artifact (Actions tab ->
#   the run -> Artifacts), handy for trying a branch.
# - Pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
#   also creates a GitHub Release with the zip attached -- that's the link to
#   give people.
#
# The app is ad-hoc signed only (PyInstaller does that), not notarized, so the
# first launch needs System Settings -> Privacy & Security -> "Open Anyway".
# See the README's "Installing the app on a Mac".
name: Build Mac app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to create the release on a tag

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Build the app
        run: |
          python3 -m pip install "pyinstaller==6.22.3"
          pyinstaller --noconfirm packaging/statto_reports.spec
      - name: Smoke-test the built app
        run: |
          "dist/Statto Reports.app/Contents/MacOS/Statto Reports" --no-browser --port 8790 --seasons-dir "$RUNNER_TEMP/seasons" --settings-file "$RUNNER_TEMP/settings.json" &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8790/api/ping && break; sleep 1; done
          curl -fs -o /dev/null http://127.0.0.1:8790/tagging-site/
          curl -fs -X POST -H "Origin: http://127.0.0.1:8790" http://127.0.0.1:8790/api/quit
      - name: Zip
        run: ditto -c -k --keepParent "dist/Statto Reports.app" "Statto-Reports-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Statto-Reports-mac
          path: Statto-Reports-mac.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Statto-Reports-mac.zip --title "Statto Reports $GITHUB_REF_NAME" --generate-notes
