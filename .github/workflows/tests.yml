name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The stats engine against its frozen results, and public/ being up to date
  # (tests/test_stats.py). Fast; no browser.
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stats engine and build
        run: python3 -m unittest discover -s tests -p "test_stats.py" -v

  # The site: a local copy run by Wrangler with a local D1 database, tested
  # through its API and in a browser (tests/test_site.py).
  site:
    runs-on: ubuntu-latest
    env:
      STATTO_REQUIRE_SITE_TESTS: "1"   # fail, don't skip, if a piece is missing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler, Playwright and Chromium
        run: |
          npm ci
          python3 -m pip install -r tests/requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Site tests
        run: python3 -m unittest discover -s tests -p "test_site.py" -v
