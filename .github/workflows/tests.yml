name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Command-line build still works
        run: python3 statto_to_html_report.py examples/example_season.statto -o /tmp/editor.html

  # The browser tests (tests/test_browser.py): the editor, the app's autosave,
  # tagging pages and the shared tagging site, in headless Chromium.
  browser:
    runs-on: ubuntu-latest
    env:
      STATTO_REQUIRE_BROWSER_TESTS: "1"   # fail, don't skip, if the browser is missing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python3 -m pip install -r tests/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
      - name: Browser tests
        run: python3 -m unittest discover -s tests -p "test_browser.py" -v

  # The team site (site/): a local copy run by Wrangler with a local D1
  # database, tested through its API and in a browser (tests/test_site.py).
  site:
    runs-on: ubuntu-latest
    env:
      STATTO_REQUIRE_SITE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler, Playwright and Chromium
        run: |
          cd site && npm ci && cd ..
          python3 -m pip install -r tests/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
      - name: Team site tests
        run: python3 -m unittest discover -s tests -p "test_site.py" -v
